      <input id="dc" type="password" autocomplete="current-password"></div>
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:18px">
      <button class="btn" id="dC">Cancelar</button>
      <button class="btn peligro" id="dOk">Detener transmisión</button></div>
  </div></div>`;
  const cerrar=()=>$('#modales').innerHTML='';
  $('#dC').onclick=cerrar;
  $('#fondo').onclick=e=>{if(e.target.id==='fondo')cerrar()};
  $('#dc').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#dOk').click()}};
  $('#dc').focus();
  $('#dOk').onclick=async e=>{
    const clave=$('#dc').value;
    if(!clave){$('#err').textContent='Escribí tu contraseña para confirmar';return}
    e.target.disabled=true;$('#err').textContent='';
    try{await post('/api/grabador/detener',{clave})}
    catch(err){$('#err').textContent=err.message;e.target.disabled=false;
      $('#dc').value='';$('#dc').focus();return}
    cerrar();
    await soltarMirando();destruirPlayers();cerrarOrbita(true);
    tx={total:0,corriendo:0,en_vivo:0,transmitiendo:false,arrancando:false,caidas:[]};
    cargar();
  };
}
/* Antes había acá un botón "Mejorar rendimiento" que prendía la conversión
   bajo demanda. Se saca: prendido, sólo convierte lo que alguien está mirando
   y con cupo limitado, y al rotar los cupos borra la ventana en vivo de la que
   pierde la plaza con el reproductor todavía enganchado — 404 en bucle y todo
   el muro parpadeando. En un servidor de 24 hilos no ahorra nada que valga eso.
   El backend sigue aceptando el ajuste por API y por variable de entorno; lo
   que se saca es el botón que invitaba a pisar la mina. */
const ctrlAdmin=()=>'';
function vMuro(){
  destruirPlayers();
  zonaAbierta=null;
  const cs=enLinea();
  $('#titulo').textContent='Muro en vivo';
  $('#subtitulo').innerHTML=metricas(null);
  /* "Ampliar" está en el muro SIEMPRE, con cualquier locación o subgrupo
     filtrado: la cuadrícula es la misma vista y lo que cambia es qué cámaras
     entran. Poner un botón por locación sería repetir el mismo control. */
  $('#acciones').innerHTML=ctrlAdmin()
    +`<button class="btn" id="bAmpliar" title="Ver la cuadrícula en pantalla completa">Ampliar</button>`
    +`<button class="btn pri" id="bPlay">Iniciar transmisión</button>`;
  if($('#bAmpliar'))$('#bAmpliar').onclick=()=>{
    // Se busca al hacer click, no antes: la cuadrícula se dibuja despues de
    // esta línea, así que capturarla acá tomaba la vieja o nada.
    const g=$('.grid');
    if(!g){aviso('No hay cámaras que ampliar');return}
    if(document.fullscreenElement){document.exitFullscreen();return}
    (g.requestFullscreen||g.webkitRequestFullscreen||(()=>{})).call(g);
  };
  botonesTransmision(enLinea);
  $('#vista').innerHTML=cs.length?`<div class="grid">`+cs.map((c,i)=>`
    <div class="tile" data-cam="${c.id}" title="Doble clic: pantalla completa"
         style="animation-delay:${Math.min(i*.035,.5)}s">
      <video id="v${c.id}" muted playsinline></video>
      <div class="vacio" id="e${c.id}">sin transmitir</div>
      <div class="cap"><span class="pin off" id="p${c.id}"></span><b>${c.nombre}</b><span class="chip">${c.marca} ${c.modelo}</span></div>
    </div>`).join('')+`</div>`:vacio('Sin cámaras en línea','Ninguna cámara de este filtro está respondiendo.');
  // Doble clic sobre un recuadro: pantalla completa de esa camara.
  $$('.tile').forEach(t=>t.ondblclick=()=>pantallaCompleta(t));
  // Click derecho: reproducción, editar, mover de locación, eliminar.
  $$('.tile[data-cam]').forEach(t=>t.oncontextmenu=ev=>menuCamara(ev,+t.dataset.cam));
  observarTiles();arrancarLatido();avisarMirando();
  vigilar();
}
function pantallaCompleta(el){
  if(document.fullscreenElement){document.exitFullscreen();return}
  (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);
}
/* Clic en un evento: abre Reproducción en esa cámara y salta a esa hora.
   Es lo que uno quiere hacer con un evento -- verlo -- y antes no se podia. */
function verEnReproduccion(camaraId,inicio){
  rp.cam=camaraId;
  rp.sitio=(camaras.find(c=>c.id===camaraId)||{}).sitio||'';
  // Día LOCAL: slice(0,10) daba el día UTC, así que un evento de las 22 abría
  // la reproducción en el día siguiente, donde no hay nada.
  rp.fecha=diaLocal(inicio);
  rp.saltarA=segDelDia(inicio);
  vista='repro';cargar();
}
/* Un ffmpeg que se reinicia deja a la cámara sin `en_vivo` por un sondeo o
   dos. Tirar el reproductor en el primero vaciaba el recuadro y lo volvía a
   armar 4 s después; con las cámaras reiniciándose todas juntas eso era un
   parpadeo de TODO el muro a la vez. hls.js sabe reintentar solo, así que se
   le da margen antes de desconectarlo. */
const caidas=new Map();
const TOLERA_CAIDAS=2;
/* Un solo reloj. Cada botón que llamaba a vigilar() arrancaba su propia cadena
   de setTimeout: terminaban sondeando el grabador tres veces por ciclo y
   pisándose entre ellas al conectar y desconectar reproductores. */
let relojVigilar=null;
async function vigilar(){
  if(relojVigilar){clearTimeout(relojVigilar);relojVigilar=null}
  let st;try{st=await api('/api/grabador')}catch{return}
  tx={total:st.total,corriendo:st.corriendo,en_vivo:st.en_vivo||0,
      transmitiendo:!!st.transmitiendo,arrancando:!!st.arrancando,
      caidas:st.caidas||[]};
  pintarBotonTransmision();
  if(!conVideo())return;
  st.camaras.forEach(t=>{
    // `en_vivo` es lo que decide, no `corriendo`: una cámara que graba pero no
    // se está convirtiendo no tiene playlist, y engancharle un reproductor era
    // pedirle al navegador que reintente un 404 para siempre.
    if(t.en_vivo){caidas.delete(t.camara_id);conectar(t.camara_id);return}
    const n=(caidas.get(t.camara_id)||0)+1;caidas.set(t.camara_id,n);
    const h=players.get(t.camara_id);
    if(h&&n<TOLERA_CAIDAS)return;          // puede volver solo: no lo cortemos
    if(h){h.destroy();players.delete(t.camara_id)}
    // Si está en pantalla, el mensaje lo pone pintarEstadoConversion
    // ("preparando…" / "sin cupo"): pisarlo acá hacía parpadear el recuadro.
    const e=$('#e'+t.camara_id);
    if(e&&!t.esperando_cupo&&!enPantalla.has(t.camara_id)){
      e.style.display='flex';e.textContent='grabando sin convertir'}
  });
  if(vista==='muro'||vista==='plano')$('#subtitulo').innerHTML=metricas(st);
  pintarEstadoConversion();
  if(st.total)relojVigilar=setTimeout(vigilar,4000);
}
function conectar(id){
  const url=`/media/${id}/vivo.m3u8`,v=$('#v'+id);
  if(!v||players.has(id))return;
  const ok=()=>{const e=$('#e'+id);if(e)e.style.display='none';const p=$('#p'+id);if(p)p.className='pin rec'};
  const mal=t=>{const e=$('#e'+id);if(e){e.style.display='flex';e.innerHTML=`<div class="giro"></div>${t}`}
                const p=$('#p'+id);if(p)p.className='pin off'};
  /* hls.js PRIMERO, y el reproductor nativo sólo como último recurso.
     Estaba al revés, y en Chrome eso significaba no usar hls.js nunca:
     `canPlayType('application/vnd.apple.mpegurl')` devuelve **"maybe"**, que es
     un string no vacío y por lo tanto verdadero. La rama nativa estaba pensada
     para Safari, que sí reproduce HLS de verdad; Chrome dice "maybe", agarra el
     .m3u8, y se queda sin nada de lo que hace falta para una transmisión EN
     VIVO -- reintentos, `liveSyncDurationCount`, `startLoad()` cuando se corta
     la red, `recoverMediaError()`. El resultado era que cada recuadro llegaba
     al final del playlist, se trababa, recargaba y se volvía a trabar: TODO el
     muro congelándose y volviendo cada pocos segundos, y sin un solo error en
     la consola, porque el reproductor nativo falla en silencio.
     La regla correcta es la de siempre: si hls.js corre en este navegador, se
     usa hls.js; nativo sólo donde hls.js no puede (Safari, iOS). */
  if(!window.Hls||!Hls.isSupported()){
    if(!v.canPlayType('application/vnd.apple.mpegurl'))return;
    v.src=url;v.addEventListener('loadeddata',ok);v.play().catch(()=>{});return;
  }
  const h=new Hls({liveSyncDurationCount:4,liveMaxLatencyDurationCount:12,maxBufferLength:20,
    manifestLoadingMaxRetry:30,manifestLoadingRetryDelay:1000,levelLoadingMaxRetry:30,fragLoadingMaxRetry:12});
  h.loadSource(url);h.attachMedia(v);h.on(Hls.Events.FRAG_BUFFERED,ok);
  h.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;
    if(d.type===Hls.ErrorTypes.NETWORK_ERROR){mal('reconectando');h.startLoad()}
    else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){mal('recuperando');h.recoverMediaError()}
    else{mal('reintentando');h.destroy();players.delete(id);setTimeout(()=>conectar(id),4000)}});
  v.addEventListener('waiting',()=>{if(h.liveSyncPosition&&v.currentTime<h.liveSyncPosition-10)v.currentTime=h.liveSyncPosition});
  players.set(id,h);v.play().catch(()=>{});
}

/* ---------------- plano ---------------- */
/* El plano ya no dibuja sitios: dibuja GRUPOS que arma el usuario. Un grupo
   junta las cámaras que sirve mirar juntas —el laboratorio, el pack de
   ingreso— sin importar en qué sitio estén cargadas, y vive en la base
   (tabla `grupos`), no acá: lo que se edita en el plano queda guardado para
   todos, no en el navegador de uno.
   Las posiciones están en coordenadas del viewBox 1200x820. */
const P_ANCHO=1200,P_ALTO=820;
const P_SRV={x:330,y:250};   // el R710 en el plano, al noroeste y fuera del camino
const px=v=>(v/P_ANCHO*100).toFixed(3),py=v=>(v/P_ALTO*100).toFixed(3);

function destruirPlayers(){players.forEach(h=>{try{h.destroy()}catch{}});players.clear();caidas.clear()}

let gruposPlano=[],sinGrupo=[],zonaAbierta=null,editando=false;
/* Camino abierto dentro del plano: [yacimiento, subgrupo, subsubgrupo…].
   Sobre el mapa sólo se dibujan los de primer nivel —los yacimientos—; el
   resto de la estructura (departamentos, talleres, enfermería, repetidoras)
   se recorre entrando. */
let rutaPlano=[];
const grupoPorId=id=>gruposPlano.find(g=>g.id===id);
const raizPlano=()=>gruposPlano.filter(g=>!g.padre_id);
const hijosDe=id=>gruposPlano.filter(g=>g.padre_id===id)
  .sort((a,b)=>a.nombre.localeCompare(b.nombre));
/* Camino hasta la raíz, para las migas y para no ofrecer mover un grupo
   adentro de sí mismo. */
function ramaDe(id){
  const r=[];let g=grupoPorId(id),tope=0;
  while(g&&tope++<20){r.unshift(g);g=g.padre_id?grupoPorId(g.padre_id):null}
  return r;
}
function descendientesDe(id){
  const out=[];const pend=[id];
  while(pend.length){const a=pend.pop();
    for(const h of hijosDe(a)){out.push(h.id);pend.push(h.id)}}
  return out;
}

async function cargarGrupos(){
  try{const g=await api('/api/grupos');gruposPlano=g.grupos;sinGrupo=g.sin_grupo}
  catch{gruposPlano=[];sinGrupo=[]}
}

function vPlano(){
  destruirPlayers();
  // El observador es del muro; acá las que se miran son las de la órbita.

  // Editar el plano es de admin; el operador sólo mira.
  const ctrlEdicion=esAdmin()
    ? (editando?`<button class="btn" id="bNuevo">Nuevo grupo</button>`:'')

  if(!gruposPlano.length){
    $('#vista').innerHTML=`<div class="plano"><div class="pvacio">
      ${vacio('Todavía no hay grupos','Un grupo junta las cámaras que te sirve mirar juntas —el laboratorio, el pack de ingreso— sin importar en qué sitio estén cargadas.')}
      <div style="display:flex;gap:9px">
        <button class="btn" id="bNuevo2">Crear un grupo vacío</button>
        <button class="btn pri" id="bSembrar">Armarlos desde los sitios</button>
      </div></div></div>`;
    $('#bSembrar').onclick=async e=>{e.target.disabled=true;
      await post('/api/grupos/sembrar');await cargarGrupos();vPlano()};
    $('#bNuevo2').onclick=()=>modalGrupo(null,null);
    return;
  }

  const srv=P_SRV;
  $('#vista').innerHTML=`<div class="plano anim ${editando?'editando':''}" id="plano">
    <svg class="pmapa" viewBox="0 0 1200 820">
      ${raiz.map(g=>`<path class="penlace" d="M${srv.x} ${srv.y} L${g.x} ${g.y}"/>`).join('')}
    </svg>
    ${raiz.map(g=>`
      <div class="pzona ${g.en_linea?'':'vacia'}" data-g="${g.id}"
           style="left:${px(g.x)}%;top:${py(g.y)}%">
        <div class="pnodo">${g.total}
          <button class="plapiz" data-edit="${g.id}" title="Editar locación">${svgLapiz()}</button>
        </div>
        <div class="petiq"><b>${g.nombre}</b><span>${g.en_linea}/${g.total} en línea${
          g.subgrupos?` · ${g.subgrupos} subgrupo${g.subgrupos>1?'s':''}`:''}</span></div>
      </div>`).join('')}
    <div class="psrv" style="left:${px(srv.x)}%;top:${py(srv.y)}%">
      <b>Servidor</b></div>
    <div class="pleyenda">${editando
      ? 'Arrastrá las locaciones para moverlas. El lápiz edita nombre y cámaras; el click derecho agrega subgrupos.'
      : 'Click en una locación para entrar; click derecho para más opciones.'}</div>
  </div>`;

  $$('.pzona').forEach(e=>arrastrable(e));
  $$('.pzona').forEach(e=>e.oncontextmenu=ev=>menuGrupo(ev,+e.dataset.g));
  $$('.plapiz').forEach(b=>b.onclick=ev=>{ev.stopPropagation();
    modalGrupo(gruposPlano.find(g=>g.id===+b.dataset.edit))});
  arrancarLatido();
  if(rutaPlano.length&&!editando&&grupoPorId(rutaPlano[0]))pintarOrbita();
  vigilar();
}
const svgLapiz=()=>'<svg width="11" height="11" viewBox="0 0 16 16" fill="none" '
  +'stroke="currentColor" stroke-width="1.6"><path d="M11.2 2.4l2.4 2.4-8 8-3.2.8.8-3.2z" '
  +'stroke-linejoin="round"/></svg>';

/* Arrastrar un grupo. Fuera del modo edición el mismo elemento abre la órbita,
   así que el click sólo cuenta si el puntero no se movió. */
function arrastrable(el){
  const g=()=>gruposPlano.find(x=>x.id===+el.dataset.g);
  let mov=false,idp=null;
  el.onpointerdown=ev=>{
    if(!editando||ev.target.closest('.plapiz'))return;
    ev.preventDefault();mov=false;idp=ev.pointerId;
    el.setPointerCapture(idp);el.classList.add('arrastrando');
  };
  el.onpointermove=ev=>{
    if(idp===null)return;
    mov=true;
    const caja=$('#plano').getBoundingClientRect();
    // De píxeles de pantalla a coordenadas del viewBox, que es como se guarda.
    const x=Math.min(Math.max((ev.clientX-caja.left)/caja.width*P_ANCHO,0),P_ANCHO);
    const y=Math.min(Math.max((ev.clientY-caja.top)/caja.height*P_ALTO,0),P_ALTO);
    const gr=g();gr.x=x;gr.y=y;
    el.style.left=px(x)+'%';el.style.top=py(y)+'%';
    const linea=$$('#plano .penlace')[gruposPlano.indexOf(gr)];
    if(linea)linea.setAttribute('d',`M${P_SRV.x} ${P_SRV.y} L${x.toFixed(1)} ${y.toFixed(1)}`);
  };
  const soltar=async ev=>{
    if(idp===null)return;
    try{el.releasePointerCapture(idp)}catch{}
    idp=null;el.classList.remove('arrastrando');
    if(!mov)return;
    const gr=g();
    // Se guarda al soltar, no en cada movimiento: si no, un arrastre serían
    // cien PATCH.
    try{await api(`/api/grupos/${gr.id}`,{method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({x:gr.x,y:gr.y})})}catch{}
  };
  el.onpointerup=soltar;el.onpointercancel=soltar;
  el.onclick=()=>{if(!editando&&!mov)abrirZona(g())};
}

/* Órbita: las cámaras salen del centro unidas por hilos. Los radios se
   alternan cuando son muchas, si no se tocan entre sí. */
function posicionesOrbita(n){
  return Array.from({length:n},(_,i)=>{
    const a=(-90+360/n*i)*Math.PI/180,dentro=n>8&&i%2===1;
    return {x:500+(dentro?232:400)*Math.cos(a),y:350+(dentro?148:268)*Math.sin(a),
            retraso:(0.06+i*0.04).toFixed(3)+'s'};
  });
}
function abrirZona(g){
  if(!g)return;
  cerrarOrbita(true);
  rutaPlano=[g.id];zonaAbierta=g.id;
  pintarOrbita();
}
/* Entrar y salir por el árbol sin cerrar la órbita. */
function entrarGrupo(id){rutaPlano.push(id);pintarOrbita()}
function subirGrupo(n){
  rutaPlano=rutaPlano.slice(0,Math.max(1,n));
  pintarOrbita();
}

/* Dibuja el nivel abierto: primero los subgrupos, después las cámaras que
   cuelgan directamente de este grupo. Un grupo puede tener las dos cosas —la
   cámara del portón puede colgar del yacimiento aunque el resto esté repartido
   en talleres—, así que la órbita mezcla los dos tipos de nodo. */
function pintarOrbita(){
  const g=grupoPorId(rutaPlano[rutaPlano.length-1]);
  if(!g){cerrarOrbita(true);return}
  zonaAbierta=rutaPlano[0];
  const viejo=$('#orbita');if(viejo)viejo.remove();

  const hijos=hijosDe(g.id);
  const cams=g.camaras||[];
  const items=[...hijos.map(h=>({t:'g',g:h})),...cams.map(c=>({t:'c',c}))];
  const pos=posicionesOrbita(Math.max(items.length,1));
  const ox=v=>(v/1000*100).toFixed(3),oy=v=>(v/700*100).toFixed(3);
  const rama=ramaDe(g.id);

  const o=document.createElement('div');
  o.className='orbita';o.id='orbita';
  o.innerHTML=`<div class="ovelo"></div><div class="ocaja">
    <svg class="ohilos" viewBox="0 0 1000 700" preserveAspectRatio="none">
      ${items.map((_,i)=>`<line class="ohilo" x1="500" y1="350" x2="${pos[i].x.toFixed(1)}"
        y2="${pos[i].y.toFixed(1)}" style="animation-delay:${pos[i].retraso}"/>`).join('')}
    </svg>
    ${items.map((it,i)=>{
      const est=`left:${ox(pos[i].x)}%;top:${oy(pos[i].y)}%;animation-delay:${pos[i].retraso}`;
      if(it.t==='g')return `<div class="osub" data-sub="${it.g.id}" style="${est}">
        <div class="nodo">${it.g.total}</div>
        <div class="et"><b>${it.g.nombre}</b><span>${it.g.en_linea}/${it.g.total}${
          it.g.subgrupos?` · ${it.g.subgrupos} sub`:''}</span></div></div>`;
      const c=it.c;
      return `<div class="ocam" data-cam="${c.id}"
        style="${est};transform:translate(-50%,-50%)" title="Doble clic: pantalla completa">
        <div class="marco"><video id="v${c.id}" muted playsinline></video>
          <div class="vacio" id="e${c.id}">${c.estado==='en_linea'?'sin transmitir':'sin conexión'}</div></div>
        <div class="pie"><span class="pin off" id="p${c.id}"></span><b>${c.nombre}</b></div>
      </div>`}).join('')}
    <div class="ocubo">
      ${rama.length>1?`<div class="migas">${rama.map((r,i)=>
        i===rama.length-1?`<span>${r.nombre}</span>`
        :`<a data-sube="${i+1}">${r.nombre}</a><span>›</span>`).join('')}</div>`:''}
      <b>${g.nombre}</b>
      <span>${g.en_linea}/${g.total} en línea${hijos.length?` · ${hijos.length} subgrupo${hijos.length>1?'s':''}`:''}</span>
      ${esAdmin()?`<button class="btn" id="oNuevo" style="height:24px;font-size:10.5px;padding:0 9px;margin-top:9px">+ Subgrupo</button>`:''}
      <button class="ocerrar" id="oX" title="Cerrar">×</button>
    </div>
  </div>`;
  $('#plano').appendChild(o);

  $('#oX').onclick=e=>{e.stopPropagation();cerrarOrbita()};
  o.querySelector('.ovelo').onclick=()=>cerrarOrbita();
  o.querySelectorAll('[data-sube]').forEach(a=>a.onclick=e=>{
    e.stopPropagation();subirGrupo(+a.dataset.sube)});
  o.querySelectorAll('.osub').forEach(n=>{
    n.onclick=e=>{e.stopPropagation();entrarGrupo(+n.dataset.sub)};
    n.oncontextmenu=e=>menuGrupo(e,+n.dataset.sub);
  });
  $$('#orbita .ocam').forEach(t=>{
    t.ondblclick=()=>pantallaCompleta(t);
    t.oncontextmenu=ev=>menuCamara(ev,+t.dataset.cam);
  });
  if($('#oNuevo'))$('#oNuevo').onclick=e=>{e.stopPropagation();modalGrupo(null,g.id)};

  if(!items.length)$('.ocubo').insertAdjacentHTML('beforeend',
    `<div style="font-size:10px;color:var(--txt4);margin-top:8px">vacío${
      esAdmin()?' — agregá un subgrupo o cámaras con el lápiz':''}</div>`);

  // Sólo se declaran como "en pantalla" las cámaras de ESTE nivel.
  enPantalla.clear();cams.forEach(c=>enPantalla.add(c.id));
  avisarMirando();
  vigilar();
}

/* Abrir una locación en el plano, venga de donde venga.
   Desde la barra lateral se puede pedir estando en cualquier vista, y
   `pintarOrbita` cuelga del `#plano`: sin cambiar de vista primero, no
   encontraba dónde dibujar y no pasaba nada. */
function abrirRamaEnPlano(id){
  if(vista!=='plano'){vista='plano';cargar().then(()=>abrirRamaEnPlano(id));return}
  const rama=ramaDe(id);
  if(!rama.length)return;
  rutaPlano=rama.map(r=>r.id);
  zonaAbierta=rutaPlano[0];
  pintarOrbita();
}

/* Click derecho sobre una locación del mapa o un subgrupo de la órbita. */
function menuGrupo(ev,id){
  const g=grupoPorId(id);if(!g)return;
  const cab=`<b>${g.nombre}</b>${g.total} cámaras`
    +(g.subgrupos?` · ${g.subgrupos} subgrupo${g.subgrupos>1?'s':''}`:'');
  const op=[{txt:g.subgrupos||g.total?'Abrir en el plano':'Abrir (vacío)',
             hacer:()=>abrirRamaEnPlano(id)}];
  if(esAdmin())op.push(
    {sep:true},
    {txt:'Nuevo subgrupo aquí…',hacer:()=>modalGrupo(null,id)},
    {txt:'Editar nombre y cámaras…',hacer:()=>modalGrupo(g)},
    {txt:'Mover a otra locación…',hacer:()=>modalMoverGrupo(g)},
    {sep:true},
    {txt:g.subgrupos?`Eliminar con sus ${g.subgrupos} subgrupo${g.subgrupos>1?'s':''}`:'Eliminar grupo',
     peligro:true,hacer:()=>borrarGrupo(g)});
  menuContextual(ev,cab,op);
}

async function borrarGrupo(g){
  const extra=g.subgrupos
    ? `\nSe borran también sus ${g.subgrupos} subgrupo${g.subgrupos>1?'s':''}.`:'';
  if(!confirm(`¿Eliminar "${g.nombre}"?${extra}\nLas cámaras no se tocan, sólo la agrupación.`))return;
  try{
    await api(`/api/grupos/${g.id}`,{method:'DELETE'});
    if(rutaPlano.includes(g.id))cerrarOrbita(true);
    await cargarGrupos();vPlano();
  }catch(e){alert('No se pudo eliminar: '+e.message)}
}

/* Recolgar un grupo de otro. La lista excluye al propio grupo y a sus
   descendientes: colgarlo de su propio hijo cerraría un ciclo. El backend lo
   rechaza igual, esto es para no ofrecer lo imposible. */
function modalMoverGrupo(g){
  const prohibidos=new Set([g.id,...descendientesDe(g.id)]);
  const destinos=gruposPlano.filter(x=>!prohibidos.has(x.id))
    .sort((a,b)=>ramaDe(a.id).map(r=>r.nombre).join(' › ')
      .localeCompare(ramaDe(b.id).map(r=>r.nombre).join(' › ')));
  $('#modales').innerHTML=`<div class="fondo" id="fondo"><div class="modal" style="width:440px">
    <h2>Mover ${g.nombre}</h2>
    <div class="d">Elegí de qué grupo cuelga. <b>Primer nivel</b> lo deja como locación
      propia sobre el mapa. Se mueve con todo lo que tenga adentro.</div>
    <div class="err" id="err"></div>
    <div class="campo"><label>Colgar de</label>
      <select id="mgP">
        <option value="">— Primer nivel (locación del mapa) —</option>
        ${destinos.map(x=>`<option value="${x.id}" ${x.id===g.padre_id?'selected':''}>${
          ramaDe(x.id).map(r=>r.nombre).join(' › ')}</option>`).join('')}
      </select></div>
    <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:18px">
      <button class="btn" id="mgC">Cancelar</button>
      <button class="btn pri" id="mgOk">Mover</button></div>
  </div></div>`;
  const cerrar=()=>$('#modales').innerHTML='';
  $('#mgC').onclick=cerrar;$('#fondo').onclick=e=>{if(e.target.id==='fondo')cerrar()};
  $('#mgOk').onclick=async e=>{
    const v=$('#mgP').value;
    const padre_id=v?+v:null;
    if(padre_id===(g.padre_id??null)){cerrar();return}
    e.target.disabled=true;
    try{
      await api(`/api/grupos/${g.id}`,{method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({padre_id,mover:true})});
      cerrar();cerrarOrbita(true);await cargarGrupos();vPlano();
    }catch(err){$('#err').textContent=err.message;e.target.disabled=false}
  };
}

/* ---- editar un grupo: nombre, cámaras, borrar ---- */
function modalGrupo(g,padreId){
  const nuevo=!g;
  // Al crear, `padreId` dice dónde cuelga; al editar se conserva el que tenga.
  const padre=nuevo?(padreId??null):(g.padre_id??null);
  const rutaPadre=padre?ramaDe(padre).map(r=>r.nombre).join(' › '):null;
  const sel=new Set(nuevo?[]:g.camaras.map(c=>c.id));
  const otros=id=>gruposPlano.filter(x=>(!g||x.id!==g.id)&&x.camaras.some(c=>c.id===id))
    .map(x=>x.nombre);
  const pintarLista=()=>{
    const q=($('#gq').value||'').toLowerCase();
    const cs=camaras.filter(c=>!q||c.nombre.toLowerCase().includes(q)
      ||(c.sitio||'').toLowerCase().includes(q)||(c.ubicacion||'').toLowerCase().includes(q));
    const porSitio={};
    cs.forEach(c=>{(porSitio[c.sitio||'sin sitio']??=[]).push(c)});
    $('#glista').innerHTML=Object.keys(porSitio).sort().map(s=>
      `<div class="grupo-sitio">${s}</div>`+porSitio[s].map(c=>{
        const en=otros(c.id);
        return `<label class="fila-cam">
          <input type="checkbox" data-c="${c.id}" ${sel.has(c.id)?'checked':''}>
          <span class="est ${c.estado==='en_linea'?'on':''}"></span>${c.nombre}
          ${en.length?`<span class="otro">también en ${en.join(', ')}</span>`:''}
        </label>`}).join('')).join('')
      ||`<div style="padding:14px;font-size:11.5px;color:var(--txt3)">Ninguna cámara coincide.</div>`;
    $$('#glista input').forEach(i=>i.onchange=()=>{
      i.checked?sel.add(+i.dataset.c):sel.delete(+i.dataset.c);pintarCuenta()});
  };
  const pintarCuenta=()=>$('#gcuenta').textContent=
    `${sel.size} ${sel.size===1?'cámara elegida':'cámaras elegidas'}`;

  $('#modales').innerHTML=`<div class="fondo" id="fondo"><div class="modal ancho">
    <h2>${nuevo?(rutaPadre?'Nuevo subgrupo':'Nueva locación'):'Editar '+(padre?'subgrupo':'locación')}</h2>
    <div class="d">${rutaPadre
      ? `Cuelga de <b>${rutaPadre}</b>. `
      : 'Queda como locación de primer nivel, sobre el mapa. '}Un grupo junta las cámaras
      que te sirve mirar juntas; puede cruzar sitios, y una cámara puede estar en más de uno.</div>
    <div class="err" id="err"></div>
    <div class="campo"><label>Nombre *</label>
      <input id="gn" placeholder="${rutaPadre?'Taller mecánico':'Sitio Norte'}" value="${nuevo?'':g.nombre.replace(/"/g,'&quot;')}"></div>
    <div class="campo buscador"><label>Cámaras</label>
      <input id="gq" placeholder="Buscar por nombre, sitio o ubicación…"></div>
    <div class="lista-cam" id="glista"></div>
    <div class="cuenta-sel" id="gcuenta"></div>
    <div style="display:flex;gap:9px;margin-top:16px">
      ${nuevo?'':'<button class="btn peligro" id="gDel">Borrar grupo</button>'}
      <div class="crece"></div>
      <button class="btn" id="gC">Cancelar</button>
      <button class="btn pri" id="gOk">${nuevo?'Crear':'Guardar'}</button>
    </div>
  </div></div>`;
  pintarLista();pintarCuenta();
  $('#gq').oninput=pintarLista;
  const cerrar=()=>$('#modales').innerHTML='';
  $('#gC').onclick=cerrar;
  $('#fondo').onclick=e=>{if(e.target.id==='fondo')cerrar()};
  if(!nuevo)$('#gDel').onclick=()=>{cerrar();borrarGrupo(g)};
  $('#gOk').onclick=async e=>{
    const nombre=$('#gn').value.trim();
    if(!nombre){$('#err').textContent='El grupo necesita un nombre';return}
    e.target.disabled=true;
    try{
      let id=nuevo?null:g.id;
      if(nuevo)id=(await post('/api/grupos',{nombre,camaras:[...sel],padre_id:padre})).id;
      else{
        if(nombre!==g.nombre)await api(`/api/grupos/${id}`,{method:'PATCH',
          headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre})});
        await api(`/api/grupos/${id}/camaras`,{method:'PUT',
          headers:{'Content-Type':'application/json'},body:JSON.stringify({camaras:[...sel]})});
      }
      cerrar();await cargarGrupos();
      // La órbita abierta puede haber cambiado de contenido; se vuelve a
      // dibujar en el mismo nivel en vez de cerrarse, que era desorientador.
      if(rutaPlano.length)pintarOrbita();
      vPlano();
    }catch(err){e.target.disabled=false;$('#err').textContent=err.message}
  };
}
function cerrarOrbita(inmediato){
  const o=$('#orbita');
  zonaAbierta=null;rutaPlano=[];
  enPantalla.clear();
  if(!o)return;
  destruirPlayers();
  if(inmediato){o.remove();return}
  o.classList.add('cerrando');
  setTimeout(()=>{o.remove()},300);
  avisarMirando();
}

/* ---------------- reproducción ---------------- */
/* La barra, el cursor y el video salen todos de la MISMA lista que arma el
   backend (`/segmentos?fecha=`). Cada tramo trae dos cosas que antes no
   existían: su `duracion` real —medida con ffprobe, no supuesta— y el
   `offset` que ocupa dentro de la playlist del día.

   Antes esto suponía que todo segmento duraba 60 s y calculaba la posición
   como `índice * 60`. Sobre un día real del parque eso se va más de un
   minuto (hay segmentos de 4 s cuando la cámara se cae), así que el video
   terminaba en otro lado que el cursor y buscar no servía de nada.

   El día es un día LOCAL de punta a punta: el backend agrupa con
   `date(inicio,'localtime')` y acá se lee con `getHours()`. Mezclar los dos
   husos —que es lo que pasaba— desordenaba la línea de tiempo. */
let rp={cam:null,sitio:null,fecha:null,segs:[],evs:[],dias:[],dur:0,seg:0,
        saltarA:null,ventana:null,ventanaOk:false,ventanaDur:0,comienzaEn:0,
        destino:null,pedido:0,convertido:false,codecOrigen:''};

/* Día local de un instante ISO. `iso.slice(0,10)` daría el día UTC, que a
   partir de las 21 hora argentina ya es el día siguiente. */
const diaLocal=iso=>{const d=new Date(iso);
  return `${d.getFullYear()}-${d2(d.getMonth()+1)}-${d2(d.getDate())}`};
/* segundos transcurridos del día para un instante ISO */
const segDelDia=iso=>{const d=new Date(iso);
  return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()};
const pct=s=>s/86400*100;

function vRepro(){
  const con=arch.camaras||[];
  $('#titulo').textContent='Reproducción';$('#acciones').innerHTML='';
  if(!con.length){$('#subtitulo').textContent='sin grabación todavía';
    $('#vista').innerHTML=vacio('Todavía no hay nada grabado',
      'Andá a <b>Muro en vivo</b> y apretá <b>Iniciar transmisión</b>. Desde ese momento se guarda en disco y acá vas a poder recorrer la línea de tiempo.');return}
  // El sitio se elige primero y filtra la lista de camaras: con 39 equipos,
  // buscar por nombre en una sola lista es incomodo.
  const nombreDe=id=>(camaras.find(c=>c.id===id)||{}).sitio||'';
  const sitios=[...new Set(con.map(c=>nombreDe(c.id)).filter(Boolean))].sort();
  if(!rp.cam)rp.cam=con[0].id;
  if(!rp.sitio)rp.sitio=nombreDe(rp.cam)||sitios[0]||'';
  const delSitio=con.filter(c=>!rp.sitio||nombreDe(c.id)===rp.sitio);
  if(delSitio.length&&!delSitio.some(c=>c.id===rp.cam))rp.cam=delSitio[0].id;

  $('#subtitulo').textContent=`${con.length} cámaras con grabación`;
  $('#vista').innerHTML=`
    <div class="anim" style="display:flex;gap:9px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
      <select id="sSitio" title="Locación">
        <option value="">Todas las locaciones</option>
        ${sitios.map(s=>`<option value="${s}" ${s===rp.sitio?'selected':''}>${s}</option>`).join('')}
      </select>
      <select id="sCam" title="Cámara">${delSitio.map(c=>
        `<option value="${c.id}" ${c.id===rp.cam?'selected':''}>${c.nombre}</option>`).join('')}</select>
      <select id="sDia" title="Día con grabación"></select>
      <button class="btn" id="bDA" title="Día anterior">‹</button>
      <button class="btn" id="bDS" title="Día siguiente">›</button>
      <div class="crece"></div>
      <button class="btn" id="bA">‹ anterior</button><button class="btn" id="bS">siguiente ›</button>
      <button class="btn" id="bTramo" title="Preservar o exportar un tramo">Tramo…</button>
      <button class="btn" id="bFull" title="Pantalla completa (o doble clic sobre el video)">⛶</button>
    </div>
    <div class="anim visor"><video id="vp" controls playsinline preload="auto"></video>
      <div class="vmsg" id="vmsg" hidden></div></div>
    <div class="anim panel" style="margin-top:14px">
      <div style="display:flex;align-items:baseline;gap:11px">
        <b style="font-size:12.5px">Línea de tiempo</b>
        <span class="mono" id="tlI" style="font-size:11px;color:var(--txt3)"></span>
        <div class="crece"></div><span class="mono" id="tlH" style="font-size:13px;font-weight:500"></span>
      </div>
      <div class="pista" id="pista">
        <div class="carril pres" id="cPres"></div>
        <div class="carril rec" id="cRec"></div>
        <div class="carril evs" id="cEvs"></div>
        <div class="fantasma" id="fan" style="left:0"></div>
        <div class="reloj" id="rel" style="left:0"></div>
        <div class="cursor" id="cur" style="left:0"></div>
      </div>
      <div class="horas">${Array.from({length:13},(_,i)=>`<span>${d2(i*2)}</span>`).join('')}</div>
      <div style="display:flex;gap:16px;margin-top:11px;font-size:10.5px;color:var(--txt3)">
        <span style="display:flex;align-items:center;gap:6px"><i style="width:13px;height:8px;border-radius:2px;background:linear-gradient(180deg,#4d5da8,#3a468a)"></i>grabación continua</span>
        <span style="display:flex;align-items:center;gap:6px"><i style="width:13px;height:8px;border-radius:2px;background:#e8756f"></i>evento detectado</span>
        <span style="display:flex;align-items:center;gap:6px"><i style="width:13px;height:8px;border-radius:2px;background:linear-gradient(180deg,#46d94f,#1d8f27)"></i>preservado</span>
        <span style="color:var(--txt4)">Clic en cualquier punto de la barra para saltar ahí</span>
      </div>
    </div>`;
  $('#sSitio').onchange=e=>{rp.sitio=e.target.value;rp.cam=null;rp.fecha=null;
    const l=con.filter(c=>!rp.sitio||nombreDe(c.id)===rp.sitio);
    if(l.length)rp.cam=l[0].id;vRepro()};
  // Cambiar de cámara descarta el día elegido: la otra puede no tener ese día.
  $('#sCam').onchange=e=>{rp.cam=+e.target.value;rp.fecha=null;abrirCamara()};
  $('#sDia').onchange=e=>irADia(e.target.value);
  $('#bDA').onclick=()=>saltarDia(-1);$('#bDS').onclick=()=>saltarDia(1);
  $('#bA').onclick=()=>saltar(-1);$('#bS').onclick=()=>saltar(1);
  $('#bTramo').onclick=()=>modalTramo();
  $('#bFull').onclick=pantallaCompletaVisor;
  $('#vp').addEventListener('timeupdate',cursor);
  $('#vp').addEventListener('ended',seguirVentana);
  $('#vp').closest('.visor').ondblclick=pantallaCompletaVisor;

  // Toda la pista responde al clic: se salta a la hora donde apuntaste, sin
  // tener que acertarle a un segmento.
  const p=$('#pista');
  const horaEn=ev=>{const r=p.getBoundingClientRect();
    return Math.min(86399,Math.max(0,(ev.clientX-r.left)/r.width*86400))};
  p.onclick=ev=>irA(horaEn(ev));
  p.onmousemove=ev=>{const s=horaEn(ev),x=(s/86400*100)+'%';
    const f=$('#fan'),r=$('#rel');
    if(f)f.style.left=x;
    if(r){r.style.left=x;r.textContent=hms(null,s)}};
  abrirCamara();
}

/* Qué días tiene material esta cámara. Se pregunta antes de pedir nada más:
   sin día no se puede pedir un día, y pedir "todo" era justamente el problema
   —el backend cortaba en 3000 filas de las MÁS VIEJAS, así que apenas el
   archivo pasaba los dos días la reproducción ya no veía lo reciente. */
async function abrirCamara(){
  let d;try{d=await api(`/api/camaras/${rp.cam}/dias`)}catch{d={dias:[]}}
  rp.dias=d.dias||[];
  if(!rp.fecha||!rp.dias.some(x=>x.dia===rp.fecha))
    rp.fecha=rp.dias.length?rp.dias.at(-1).dia:null;   // el más reciente
  await cargarSegmentos();
}

async function cargarSegmentos(){
  pintarSelectorDias();
  if(!rp.fecha){
    rp.segs=[];rp.evs=[];rp.dur=0;
    dibujarPista();cargarDia();
    $('#tlI').textContent='esta cámara no tiene grabación indexada';
    return;
  }
  const [info,ev,pr]=await Promise.all([
    api(`/api/camaras/${rp.cam}/segmentos?fecha=${rp.fecha}`),
    api(`/api/eventos?camara_id=${rp.cam}&limite=500`),
    api(`/api/camaras/${rp.cam}/preservaciones`).catch(()=>({rangos:[]}))]);
  rp.pres=pr.rangos||[];
  rp.dias=info.dias||rp.dias;
  rp.segs=info.segmentos;rp.dur=info.duracion||0;rp.evs=ev.eventos;
  pintarSelectorDias();
  dibujarPista();
  cargarDia();

  const mb=(rp.segs.reduce((a,s)=>a+(s.bytes||0),0)/1e6).toFixed(1);
  // Lo preservado se nombra en texto y no sólo con la barra verde: un tramo
  // corto es una astilla de pocos píxeles y hay que poder enterarse igual.
  const nPres=(rp.pres||[]).filter(r=>
    diaLocal(r.desde)===rp.fecha||diaLocal(r.hasta)===rp.fecha).length;
  $('#tlI').innerHTML=rp.segs.length
    ? `${rp.segs.length} tramos · ${(rp.dur/60).toFixed(0)} min de video · ${mb} MB`
      +(nPres?` · <b style="color:var(--verde2,#46d94f)">${nPres} tramo${nPres>1?'s':''} preservado${nPres>1?'s':''}</b>`:'')
    : 'sin grabación este día';
  if(!rp.segs.length)return;

  // Si se llego desde un evento, se abre justo unos segundos antes para ver
  // como empezo, no en el momento exacto del disparo.
  if(rp.saltarA!=null){const s=Math.max(0,rp.saltarA-5);rp.saltarA=null;irA(s)}
  else irA(segDelDia(rp.segs[0].inicio));
}

function pintarSelectorDias(){
  const s=$('#sDia');if(!s)return;
  s.innerHTML=rp.dias.length
    ? rp.dias.map(d=>`<option value="${d.dia}" ${d.dia===rp.fecha?'selected':''}>${d.dia} · ${d.gb.toFixed(2)} GB</option>`).join('')
    : `<option value="">sin días grabados</option>`;
  const i=rp.dias.findIndex(d=>d.dia===rp.fecha);
  if($('#bDA'))$('#bDA').disabled=i<=0;
  if($('#bDS'))$('#bDS').disabled=i<0||i>=rp.dias.length-1;
}
function irADia(dia){if(!dia||dia===rp.fecha)return;
  rp.fecha=dia;rp.saltarA=null;cargarSegmentos()}
const saltarDia=d=>{const i=rp.dias.findIndex(x=>x.dia===rp.fecha),j=i+d;
  if(i<0||j<0||j>=rp.dias.length)return;irADia(rp.dias[j].dia)};

function dibujarPista(){
  const rec=$('#cRec'),evs=$('#cEvs'),pres=$('#cPres');if(!rec)return;
  rec.innerHTML='';evs.innerHTML='';
  /* Los tramos protegidos van en su propio carril, arriba de todo: es lo
     primero que hay que ver antes de decidir bajar la retención. */
  if(pres){
    pres.innerHTML='';
    (rp.pres||[]).forEach(r=>{
      const a=segDelDia(r.desde),b=segDelDia(r.hasta);
      // Un rango puede empezar otro día y terminar en este: se recorta.
      const i=Math.max(0,diaLocal(r.desde)===rp.fecha?a:0);
      const f=Math.min(86400,diaLocal(r.hasta)===rp.fecha?b:86400);
      if(f<=i)return;
      const el=document.createElement('div');el.className='pres-r';
      // Piso de ancho: cinco minutos sobre veinticuatro horas son cuatro
      // pixeles y no se ven. Se exagera a proposito -- lo que importa acá es
      // notar QUE hay algo protegido, no medir cuanto.
      el.style.left=pct(i)+'%';el.style.width=Math.max(.5,pct(f-i))+'%';
      el.title=`preservado: ${r.motivo||'sin motivo'}`;
      pres.appendChild(el);
    });
  }

  // Un dia entero son hasta 1440 tramos de 60 s: dibujados uno por uno quedan
  // astillas de un pixel imposibles de ver y de apuntar. Se unen los
  // consecutivos, que es lo que uno realmente quiere ver: donde hay grabacion
  // y donde hay huecos. Se usa la duracion real de cada tramo, no 60 fijo.
  let ini=null,fin=null;
  const cerrar=()=>{if(ini===null)return;
    const el=document.createElement('div');el.className='seg';
    el.style.left=pct(ini)+'%';el.style.width=Math.max(.08,pct(fin-ini))+'%';
    el.title=`grabación ${hms(null,ini)} – ${hms(null,fin)}`;rec.appendChild(el);ini=null};
  rp.segs.forEach(s=>{const a=segDelDia(s.inicio),b=a+(s.duracion||60);
    if(ini===null){ini=a;fin=b;return}
    if(a-fin<=90){fin=b}else{cerrar();ini=a;fin=b}});
  cerrar();

  // Los eventos en su propio carril, debajo. Antes se dibujaban encima de la
  // grabacion y se tapaban entre si.
  rp.evsDia=(rp.evs||[]).filter(e=>diaLocal(e.inicio)===rp.fecha)
                        .sort((a,b)=>a.inicio.localeCompare(b.inicio));
  // Cien eventos en tres horas son cien barras de 3 px encimadas: se ven como
  // una mancha. Los que caen a menos de dos minutos se agrupan en una sola
  // marca que dice cuantos hay.
  const grupos=[];
  rp.evsDia.forEach(e=>{const s=segDelDia(e.inicio),u=grupos[grupos.length-1];
    if(u&&s-u.fin<=120){u.fin=s;u.n++;u.tipos.add(e.tipo);if(e.clip)u.clips++}
    else grupos.push({ini:s,fin:s,n:1,tipos:new Set([e.tipo]),clips:e.clip?1:0})});

  grupos.forEach(g=>{const el=document.createElement('div');
    el.className='mev'+(g.n>1?' varios':'');
    el.style.left=pct(g.ini)+'%';
    el.style.width=`max(3px, ${pct(Math.max(g.fin-g.ini,20))}%)`;
    el.title=g.n===1
      ? `${[...g.tipos][0]} · ${hms(null,g.ini)}${g.clips?' · con clip':''}`
      : `${g.n} eventos entre ${hms(null,g.ini)} y ${hms(null,g.fin)}`+
        ` · ${[...g.tipos].join(', ')}${g.clips?` · ${g.clips} con clip`:''}`;
    el.onclick=ev=>{ev.stopPropagation();irA(g.ini)};
    evs.appendChild(el)});
}

/* ---- el video: una ventana MP4 por vez ----
   El servidor arma un MP4 de 10 minutos con ffmpeg y esto lo reproduce con
   `<video>` a secas: sin hls.js y sin MediaSource. Ver `backend/app/vod.py`
   por qué se cambió. En dos palabras: los .ts del archivo NO se pueden
   encadenar —todos arrancan en el mismo PTS, así que el tiempo vuelve atrás
   en cada tramo y MediaSource se traba— y un tercio del parque graba en
   H.265, que el navegador no decodifica ni queriendo. ffmpeg arregla las dos
   cosas de una pasada. */
const VENTANA=300;
const ventanaDe=seg=>Math.floor(seg/VENTANA)*VENTANA;

function mensajeVisor(txt,girando){
  const m=$('#vmsg');if(!m)return;
  if(!txt){m.hidden=true;m.innerHTML='';return}
  m.hidden=false;
  m.innerHTML=(girando?'<div class="giro"></div>':'')+txt;
}
/* Doble clic en el visor: pantalla completa, igual que en el muro. El botón
   nativo del <video> también funciona; esto es por costumbre. */
function pantallaCompletaVisor(){
  const el=$('#vp')?.closest('.visor');if(!el)return;
  if(document.fullscreenElement){document.exitFullscreen();return}
  (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el);
}

/* Prepara la ventana que contiene `seg` y deja el video posicionado ahí.
   Se le pide primero a `/ventana`, que arma el MP4 y contesta en qué segundo
   del día arranca: como se incluyen tramos enteros, puede empezar un poco
   antes de lo pedido y hay que descontarlo al posicionar. */
async function abrirVentana(seg){
  const v=$('#vp');if(!v||!rp.fecha)return;
  const inicio=ventanaDe(seg);
  rp.destino=seg;
  if(rp.ventana===inicio&&rp.ventanaOk){posicionar();return}

  rp.ventana=inicio;rp.ventanaOk=false;
  const pedido=++rp.pedido;
  mensajeVisor('<b>Preparando el video…</b>',true);
  let info;
  try{info=await api(`/api/camaras/${rp.cam}/ventana?fecha=${rp.fecha}&inicio=${inicio}`)}
  catch(e){
    if(pedido!==rp.pedido)return;
    rp.ventana=null;
    mensajeVisor(`<b>No se pudo preparar el video</b><span>${e.message}</span>`);
    return;
  }
  // Mientras se armaba, el usuario pudo haber clickeado en otro lado.
  if(pedido!==rp.pedido)return;

  rp.comienzaEn=info.comienza_en;rp.ventanaDur=info.duracion;
  rp.convertido=info.convertido;rp.codecOrigen=info.codec_origen;
  rp.ventanaOk=true;
  v.src=info.url;
  v.load();
  v.addEventListener('loadedmetadata',()=>{mensajeVisor('');posicionar()},{once:true});
  v.addEventListener('error',()=>{
    mensajeVisor('<b>El navegador no pudo abrir el video</b>'
      +`<span>códec de origen: ${rp.codecOrigen||'desconocido'}</span>`)},{once:true});
}

function posicionar(){
  const v=$('#vp');if(!v||!rp.ventanaOk)return;
  const tope=(isFinite(v.duration)&&v.duration>0?v.duration:rp.ventanaDur)-0.15;
  const t=Math.max(0,Math.min(tope,(rp.destino??rp.seg)-rp.comienzaEn));
  try{v.currentTime=t}catch{}
  v.play().catch(()=>{});
}

/* Deja el visor limpio al cambiar de día o de cámara. */
function cargarDia(){
  const v=$('#vp');if(!v)return;
  rp.ventana=null;rp.ventanaOk=false;rp.comienzaEn=0;rp.pedidaPrevia=null;
  rp.pedido=(rp.pedido||0)+1;
  v.removeAttribute('src');v.load();
  mensajeVisor(rp.segs.length?'':'<b>Sin grabación este día</b>');
}

/* Navegación por hora. `ubicar` traduce una hora del día al tramo que la
   contiene; de ahí sale la ventana que hay que pedir. */
function ubicar(seg){
  const d=rp.segs;if(!d.length)return null;
  // Los tramos se SOLAPAN un poco: ffmpeg corta en el primer fotograma clave
  // después del minuto, así que un segmento nombrado 10:30:02 puede durar
  // 60,26 s mientras el siguiente ya abre a las 10:31:00. Hay instantes que
  // caen en dos tramos y hay que quedarse siempre con el más nuevo — si no,
  // "siguiente" devolvía al tramo anterior y los botones de paso quedaban
  // trabados yendo y viniendo entre los mismos dos.
  let j=-1;
  for(let i=0;i<d.length;i++){if(segDelDia(d[i].inicio)<=seg)j=i;else break}
  if(j<0)return{t:d[0],j:0,dentro:0};              // antes del primer tramo
  const a=segDelDia(d[j].inicio),dur=d[j].duracion||60;
  if(seg<a+dur)return{t:d[j],j,dentro:seg-a};
  if(j+1<d.length)return{t:d[j+1],j:j+1,dentro:0}; // cayó en un hueco
  return{t:d[j],j,dentro:Math.max(0,dur-.5)};
}
function irA(seg){
  const u=ubicar(seg);if(!u)return;
  const destino=segDelDia(u.t.inicio)+u.dentro;
  rp.seg=destino;pintarHora();moverCursor(destino);
  abrirVentana(destino);
}
const saltar=d=>{const u=ubicar(rp.seg??0);if(!u)return;
  const j=u.j+d;if(j<0||j>=rp.segs.length)return;
  irA(segDelDia(rp.segs[j].inicio))};
function moverCursor(seg){const c=$('#cur');if(c)c.style.left=pct(seg)+'%'}
function pintarHora(){const h=$('#tlH');if(h)h.textContent=hms(null,rp.seg||0)}

/* El video corre dentro de su ventana: su posición más el segundo del día en
   que la ventana arranca da la hora real. */
function cursor(){
  const v=$('#vp');if(!v||!rp.ventanaOk)return;
  rp.seg=rp.comienzaEn+(v.currentTime||0);
  moverCursor(rp.seg);pintarHora();
  adelantar();
}

/* Pasado el 70% de la ventana se le pide al servidor la siguiente, sin usarla.
   Queda armada y en cache para cuando la reproducción llegue: si no, mirar
   media hora seguida significaba frenar a esperar en cada corte, y en las
   cámaras que hay que convertir eso son varios segundos cada vez. */
function adelantar(){
  if(!rp.ventanaOk||!rp.ventanaDur)return;
  if((rp.seg-rp.comienzaEn)/rp.ventanaDur<0.7)return;
  const sig=(rp.ventana??0)+VENTANA;
  if(sig>=86400||rp.pedidaPrevia===sig)return;
  if(!rp.segs.some(x=>segDelDia(x.inicio)>=sig&&segDelDia(x.inicio)<sig+VENTANA))return;
  rp.pedidaPrevia=sig;
  api(`/api/camaras/${rp.cam}/ventana?fecha=${rp.fecha}&inicio=${sig}`).catch(()=>{});
}

/* Al terminar la ventana, seguir con la siguiente si hay material — si no,
   mirar una hora seguida obligaría a un click cada diez minutos. */
function seguirVentana(){
  const sig=(rp.ventana??0)+VENTANA;
  if(sig>=86400)return;
  const proximo=rp.segs.find(x=>segDelDia(x.inicio)>=sig);
  if(!proximo)return;
  irA(segDelDia(proximo.inicio));
}

/* ---------------- selector de cámaras que escuchan eventos ----------------
   Escuchar eventos abre una suscripción ONVIF por cámara, así que no es gratis
   tenerlas todas: se elige. La marca vive en `camaras.escucha_eventos`, o sea
   en el servidor, para que sobreviva a un reinicio y sea la misma para todos.
   Guardar aplica en el acto —arranca las que entran, corta las que salen— y
   además queda como la lista que levanta "Iniciar transmisión". */
async function modalEventos(){
  $('#modales').innerHTML=`<div class="fondo" id="fondo"><div class="modal ancho">
    <h2>Cámaras que escuchan eventos</h2>
    <div class="d">La cámara detecta el movimiento y avisa; el servidor no analiza video.
      Sólo aparecen habilitadas las que soportan eventos ONVIF y tienen credencial.</div>
    <div class="campo buscador"><input id="evq" placeholder="Buscar cámara…"></div>
    <div class="lista-cam" id="evlista"><div style="padding:22px;text-align:center;color:var(--txt3)">
      <div class="giro" style="margin:0 auto 10px"></div>consultando…</div></div>
    <div class="err" id="err"></div>
    <div style="display:flex;gap:9px;align-items:center;margin-top:18px">
      <button class="btn" id="evTodas">Todas las que pueden</button>
      <button class="btn" id="evNinguna">Ninguna</button>
      <span style="flex:1"></span>
      <button class="btn" id="evC">Cancelar</button>
      <button class="btn pri" id="evG">Guardar</button></div>
  </div></div>`;
  const cerrar=()=>$('#modales').innerHTML='';
  $('#evC').onclick=cerrar;$('#fondo').onclick=e=>{if(e.target.id==='fondo')cerrar()};

  let cams;
  try{cams=(await api('/api/eventos/seleccion')).camaras}
  catch(e){$('#evlista').innerHTML=`<div style="padding:18px;color:var(--rojo)">${e.message}</div>`;return}

  const sel=new Set(cams.filter(c=>c.marcada&&c.puede).map(c=>c.id));
  function pintar(){
    const q=norm($('#evq').value||'').trim();
    const vis=cams.filter(c=>!q||[c.nombre,c.sitio,c.ip].some(v=>norm(v).includes(q)));
    $('#evlista').innerHTML=vis.length?vis.map(c=>{
      // Una cámara que no soporta eventos se muestra igual, apagada y diciendo
      // por qué: esconderla haría pensar que se perdió del inventario.
      const motivo=c.puede?'':'no soporta eventos ONVIF o no tiene credencial';
      return `<label class="fila-cam" style="${c.puede?'':'opacity:.45;cursor:default'}">
        <input type="checkbox" data-ev="${c.id}" ${sel.has(c.id)?'checked':''} ${c.puede?'':'disabled'}>
        <span style="flex:1">${c.nombre}
          <span style="color:var(--txt4)">· ${c.sitio||'sin sitio'}</span></span>
        ${c.escuchando?'<span class="tag g">escuchando</span>':''}
        ${c.eventos?`<span class="tag">${c.eventos}</span>`:''}
        ${motivo?`<span style="font-size:10px;color:var(--txt4)">${motivo}</span>`:''}
      </label>`}).join(''):'<div style="padding:18px;color:var(--txt4)">Ninguna coincide</div>';
    $$('#evlista input[data-ev]').forEach(i=>i.onchange=()=>{
      const id=+i.dataset.ev;i.checked?sel.add(id):sel.delete(id);actualizar()});
    actualizar();
  }
  const actualizar=()=>{
    const puede=cams.filter(c=>c.puede).length;
    $('#evG').textContent=`Guardar (${sel.size} de ${puede})`;
  };
  $('#evq').oninput=pintar;
  $('#evTodas').onclick=()=>{cams.filter(c=>c.puede).forEach(c=>sel.add(c.id));pintar()};
  $('#evNinguna').onclick=()=>{sel.clear();pintar()};
  pintar();

  $('#evG').onclick=async()=>{
    const b=$('#evG');b.disabled=true;b.innerHTML='<span class="giro"></span>aplicando…';
    try{
      const r=await api('/api/eventos/seleccion',{method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({camaras:[...sel]})});
      if(r.fallidas&&r.fallidas.length){
        $('#err').innerHTML=`<span style="color:var(--ambar)">Guardado, pero `
          +`${r.fallidas.length} no pudieron suscribirse.</span>`;
        b.disabled=false;actualizar();
      }else{cerrar()}
      cargar();
    }catch(e){$('#err').textContent=e.message;b.disabled=false;actualizar()}
  };
}

/* ---------------- cámaras ---------------- */
/* El texto del buscador vive FUERA de la vista a propósito: `cargar()` rearma
   la sección entera cada 30 s y, si el filtro viviera sólo en el DOM, cada
   refresco lo borraría a mitad de palabra. */
let buscaCam='';
/* Comparar sin acentos y sin mayúsculas. El inventario puede mezclar nombres
   con y sin acentos, o con mayúsculas distintas: buscar tal cual está
   escrito deja afuera justo lo que se busca. */
const norm=t=>String(t==null?'':t).normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'').toLowerCase();
function camarasBuscadas(){
  const q=norm(buscaCam).trim();
  const cs=camarasDelFiltro();
  if(!q)return cs;
  return cs.filter(c=>[c.nombre,c.sitio,c.ubicacion,c.marca,c.modelo,c.ip]
    .some(v=>norm(v).includes(q)));
}
function filasCamaras(cs){
  if(!cs.length)return `<tr><td colspan="7" style="text-align:center;color:var(--txt4);`
    +`padding:24px">Ninguna cámara coincide con la búsqueda</td></tr>`;
  return cs.map(c=>`<tr>
      <td style="color:var(--txt)">${c.nombre} ${c.ptz?'<span class="tag">PTZ</span>':''} ${c.lpr?'<span class="tag a">LPR</span>':''}</td>
      <td>${c.sitio||'—'}</td><td>${c.marca} <span class="mono" style="color:var(--txt3)">${c.modelo}</span></td>
      <td class="mono">${c.ip}</td><td>${c.perfil_grabacion}</td>
      <td>${c.estado==='en_linea'?'<span class="tag g">en línea</span>':c.estado==='sin_video'?'<span class="tag a">sin video</span>':c.estado==='desconocido'?'<span class="tag">sin probar</span>':'<span class="tag r">sin conexión</span>'}</td>
      <td style="text-align:right;white-space:nowrap">${esAdmin()?
        `<button class="btn" style="height:24px;font-size:10.5px;padding:0 9px" data-ed="${c.id}">Editar</button>
         <button class="btn peligro" style="height:24px;font-size:10.5px;padding:0 9px;margin-left:6px" data-del="${c.id}" data-n="${c.nombre}">Borrar</button>`:''}</td>
    </tr>`).join('');
}
/* Sólo el cuerpo de la tabla y el subtítulo. Repintar la vista entera en cada
   tecla le sacaría el foco al input, que es justo lo que se está usando. */
function repintarFilasCamaras(){
  const cs=camarasBuscadas();
  const cuerpo=$('#cuerpoCam');if(cuerpo)cuerpo.innerHTML=filasCamaras(cs);
  $('#subtitulo').textContent=subtituloCamaras(cs);
  accionesFilaCamara();
}
const subtituloCamaras=cs=>`${cs.length} equipos${sufijoFiltro()}`
  +(buscaCam.trim()?` · buscando "${buscaCam.trim()}"`:'');
function accionesFilaCamara(){
  $$('[data-ed]').forEach(b=>b.onclick=()=>{
    const c=camaras.find(x=>x.id===+b.dataset.ed);if(c)modalEditar(c)});
  $$('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm(`¿Borrar ${b.dataset.n}? Se elimina su ficha y su índice de grabación.`))return;
    await api(`/api/camaras/${b.dataset.del}`,{method:'DELETE'});cargar()});
}
function vCamaras(){
  const cs=camarasBuscadas();
  $('#titulo').textContent='Cámaras';
  $('#subtitulo').textContent=subtituloCamaras(cs);
  $('#acciones').innerHTML=esAdmin()?`<button class="btn pri" id="bN">+ Agregar cámara</button>`:'';
  if(esAdmin())$('#bN').onclick=modalNueva;
  /* Las píldoras de yacimiento mueven el MISMO `filtro` que la barra lateral,
     no uno propio: dos filtros que se pisan es la forma más rápida de que la
     lista muestre algo que nadie pidió. Y salen del árbol, no de una lista
     escrita a mano, así que un yacimiento nuevo aparece acá solo. */
  const yac=raizPlano().slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const activo=g=>filtro.tipo==='grupo'&&filtro.id===g.id;
  const chips=`<button class="chip ${filtro.tipo?'':'on'}" data-y="">Todos`
      +`<span class="n">${camaras.length}</span></button>`
    +yac.map(g=>`<button class="chip ${activo(g)?'on':''}" data-y="${g.id}">${g.nombre}`
      +`<span class="n">${camarasDeGrupo(g.id).size}</span></button>`).join('')
    +(sinGrupo.length?`<button class="chip ${filtro.tipo==='sueltas'?'on':''}" data-y="sueltas">`
      +`Sin agrupar<span class="n">${sinGrupo.length}</span></button>`:'');
  $('#vista').innerHTML=`<div class="filtros anim">${chips}<span class="separa"></span>
    <input id="qCam" type="search" placeholder="Buscar por nombre, IP, marca…"
      value="${String(buscaCam).replace(/"/g,'&quot;')}"></div>
    <div class="panel anim" style="padding:14px 4px"><table><thead><tr>

/* ---------------- calidad de video ----------------
   Cambiar la resolución de una cámara es la única palanca real sobre el disco:
   lo que ocupa una cámara ES el bitrate de su stream base. Antes había que
   entrar al equipo por su interfaz web y aplicar a ciegas; acá se ve lo que
   va a costar antes de tocarlo.

   El número que se muestra mientras se mueven los controles es una ESTIMACIÓN
   y se dice que lo es: cuánto pesa un stream depende de la escena, no sólo de
   los píxeles. Se ancla en la última medición real de esa misma cámara —no en
   una fórmula general— y al aplicar se vuelve a medir contra la cámara. */
const GBDIA=kbps=>kbps*86400/8/1024/1024;
/* Misma fórmula que `video.estimar_kbps` del servidor. Si cambia una, cambia
   la otra: que la interfaz prometa un número y el backend calcule otro es peor
   que no mostrar nada. */
function estimarKbps(a,al,f,q,ancla){
  const px=a*al*Math.max(f,1);
  if(ancla&&ancla.kbps&&ancla.ancho){
    const base=ancla.ancho*ancla.alto*Math.max(ancla.fps||1,1);
    if(base>0){
      let esc=px/base;
      if(ancla.calidad)esc*=Math.pow(q/ancla.calidad,0.8);
      return ancla.kbps*esc;
    }
  }
  return px*0.07/1000;
}

/* ---------------- almacenamiento ---------------- */
/* ---------------- almacenamiento ---------------- */
/* Dos números distintos que antes se mezclaban en uno solo:

   * el **ritmo real** (`arch.ritmo`) es lo que se está escribiendo ahora, con
     las cámaras que hay levantadas. Sale de medir el índice, no de estimar.
   * la **proyección** (`almac`) es lo que ocuparía el parque completo si las
     39 grabaran todo el día. Sirve para dimensionar el disco, no para saber
     cuánto queda.

   Y "días grabados" ya no es el lapso entre el segmento más viejo y el más
   nuevo —que decía "4 días" cuando había una hora por cámara— sino la
   cobertura real: horas grabadas dividido las cámaras que grabaron. */
let relojDisco=null,histDisco=[];

function vDisco(){
  $('#titulo').textContent='Almacenamiento';
  $('#acciones').innerHTML=esAdmin()?`<button class="btn" id="bP">Purgar ahora</button>`:'';
  $('#vista').innerHTML=`<div id="discoCuerpo"></div>`;
  if($('#bP'))$('#bP').onclick=async e=>{e.target.disabled=true;
    try{const x=await post('/api/archivo/purgar');
      $('#subtitulo').textContent=`purga: ${x.borrados} segmentos, ${x.liberado_gb} GB liberados`;
    }finally{e.target.disabled=false}
    refrescarDisco()};
  pintarDisco();
  refrescarDisco();
  // Se actualiza sola: es una pantalla que uno deja abierta mirando cómo sube
  // el disco. Repintar sólo el cuerpo evita que se rearme la vista entera y
  // se vuelva a disparar la animación de entrada cada diez segundos.
  if(relojDisco)clearInterval(relojDisco);
  relojDisco=setInterval(()=>{vista==='disco'?refrescarDisco():pararDisco()},10000);
}
function pararDisco(){if(relojDisco){clearInterval(relojDisco);relojDisco=null}}

async function refrescarDisco(){
  try{
    const [a,h]=await Promise.all([api('/api/archivo'),api('/api/archivo/historial?dias=14')]);
    arch=a;histDisco=h.historial||[];
  }catch{return}
  if(vista==='disco')pintarDisco();
  // La barra lateral vive de los mismos números.
  const g=$('#gTot'),d=$('#gDias'),b=$('#b1');
  if(g)g.textContent=arch.gb.toFixed(2)+' GB';
  if(d)d.textContent=textoCobertura();
  if(b)b.style.width=Math.min(100,arch.gb/arch.limite_gb*100).toFixed(2)+'%';
}

const nd=(v,dec=1,suf='')=>v==null?'—':(+v).toFixed(dec)+suf;
/* Cuánto material hay POR CÁMARA, que es la pregunta real: hasta cuándo puedo
   mirar para atrás.

   Antes tomaba `horas_grabadas` --que es la SUMA de las 31 cámaras-- y la
   dividía por 24. Con 1782,8 h sumadas daba "74,2 días grabados" donde hay
   2,4 días de historia por cámara: el número más engañoso de la pantalla,
   porque crece cada vez que se suma una cámara sin que haya un minuto más de
   pasado para mirar.

   `cobertura_dias` ya viene calculado del servidor como segundos/86400/cámaras
   y es el mismo que muestra la tarjeta "Grabado" de Almacenamiento. */
function textoCobertura(){
  if(!arch||!arch.cobertura_dias)return 'sin grabación aún';
  const d=arch.cobertura_dias;
  return d<2?`${(d*24).toFixed(1)} h por cámara`:`${d.toFixed(1)} días por cámara`;
}

/* ---------------- retención ----------------
   Cuántos días se guarda antes de que la purga borre. Las opciones no son una
   lista fija: se arman sobre el ritmo REAL que el parque está escribiendo, así
   que si se sube la calidad de las cámaras las opciones se achican solas y eso
   se ve acá, que es donde se decide.

   Se calcula del lado del navegador con los números que ya trae `/api/archivo`
   —no hace falta otra consulta cada diez segundos— y el servidor vuelve a
   hacer la misma cuenta al guardar. */
function opcionesRetencion(gbDia,tope,actual){
  const max=gbDia>0?tope/gbDia:null;
  const escala=[3,7,14,21,30,45,60,90,120,180];
  // Se cortan un poco por encima del máximo: mostrar los dos escalones que no
  // entran dice más que esconderlos.
  let ops=escala.filter(d=>!max||d<=max*1.4);
  if(max){const piso=Math.floor(max);if(piso>=1&&!ops.includes(piso))ops.push(piso)}
  if(actual&&!ops.includes(Math.round(actual)))ops.push(Math.round(actual));
  return[...new Set(ops)].sort((a,b)=>a-b);
}

  const gbDia=r.gb_dia||0, tope=arch.limite_gb||1, actual=+arch.retencion_dias||0;
  const max=gbDia>0?tope/gbDia:null;
  const puede=esAdmin();
  const ops=opcionesRetencion(gbDia,tope,actual);
  const alcanza=max&&actual<=max;

  return `<div class="ret-cab">
      <b>Días de grabación que se guardan</b>
      <span>hoy: ${nd(actual,0)} días · el parque escribe ${nd(gbDia,1)} GB/día${
        r.confiable?'':' · <span style="color:var(--ambar)">muestra corta, el número puede moverse</span>'}</span>
    </div>
    <div class="ret-ops">${ops.map(d=>{
      const ocupa=gbDia*d, entra=gbDia<=0||ocupa<=tope, sel=Math.round(actual)===d;
      return `<button class="ret-op${sel?' on':''}${entra?'':' noentra'}" data-ret="${d}"
        ${puede&&entra&&!sel?'':'disabled'}
        title="${entra?`Ocuparía ${nd(ocupa,0)} GB de los ${tope} GB útiles`:'No entra en el disco'}">
        <b>${d} días</b><span>${entra?nd(ocupa,0)+' GB':'no entra'}</span></button>`}).join('')}</div>
    <div class="ret-nota">
      Con el ritmo de hoy entran <b class="${alcanza?'ok':''}">${max?nd(max,1)+' días':'—'}</b>
      en los ${tope} GB útiles${alcanza?'':', menos de los '+nd(actual,0)+' configurados: la purga por espacio recorta antes de llegar'}.
      Subir la retención no borra nada; <b>bajarla sí</b>, se aplica en la purga
      siguiente —dos minutos— y no se recupera.
      ${puede?'':'<br>Sólo un administrador puede cambiarla.'}
    </div>`;
}
/* Se enganchan después de cada repintado: `pintarDisco` rehace el cuerpo entero
   cada diez segundos y los botones son otros. */
function engancharRetencion(){
  $$('#retPanel [data-ret]:not([disabled])').forEach(b=>b.onclick=async()=>{
    const dias=+b.dataset.ret, actual=+arch.retencion_dias||0;
    if(dias<actual&&!confirm(
        `Bajar de ${nd(actual,0)} a ${dias} días borra en la próxima purga todo lo `
        +`grabado hace más de ${dias} días. No se recupera.

¿Seguir?`))return;
    $$('#retPanel [data-ret]').forEach(x=>x.disabled=true);
    try{
      const x=await api('/api/archivo/retencion',{method:'PUT',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({dias})});
      arch.retencion_dias=x.retencion_dias;
      aviso(`Retención en ${dias} días · ocupará ${nd(x.gb_a_esos_dias,0)} GB`
        +`${x.entra?'':' · no entra en el disco, la purga por espacio va a recortar'}`,
        x.entra?'ok':'');
      refrescarDisco();
    }catch(e){aviso(e.message,'mal');pintarDisco()}
  });
}

/* Gráfico de línea vectorial, neón blanco. Sin librerías: una polilínea en un
   SVG con los tres trazos superpuestos que definen `.gl` en el CSS. Devuelve
   markup, así que se puede meter donde haga falta. */
function grafico(datos,campo,opc){
  // `ancho` es el ancho del viewBox y se elige parecido al ancho real en
  // pantalla: el SVG escala uniforme, así que si el viewBox es la mitad de
  // ancho que el panel, las tipografías salen al doble. Con esto los números
  // de los ejes se ven del mismo tamaño en el gráfico grande y en los chicos.
  const o=Object.assign({ancho:520,alto:130,unidad:'',tope:null},opc||{});
  if(!datos||datos.length<2)
    return `<div class="gvacio">hacen falta al menos dos días de grabación para dibujar la curva</div>`;

  const A=o.ancho,H=o.alto,ml=46,mr=14,mt=16,mb=22;
  const vals=datos.map(d=>+d[campo]||0);
  let max=Math.max(...vals);
  // El tope entra en la escala sólo si no aplasta la curva. Con 4 GB grabados
  // y un tope de 302, dibujarlo a escala deja la curva pegada al piso y el
  // gráfico no dice nada: en ese caso se anota al costado y listo.
  const topeCabe=o.tope!=null&&o.tope<=max*1.6;
  if(topeCabe)max=Math.max(max,o.tope);
  if(max<=0)max=1;
  max*=1.08;                                  // aire arriba de la curva
  const x=i=>ml+(A-ml-mr)*(datos.length===1?0:i/(datos.length-1));
  const y=v=>H-mb-(H-mt-mb)*(v/max);
  const linea=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${ml},${H-mb} ${linea} ${x(vals.length-1).toFixed(1)},${H-mb}`;

  // Cuatro líneas de referencia y sus valores, en la izquierda.
  const malla=[0,.25,.5,.75,1].map(f=>{const v=max*f,yy=y(v);
    return `<line class="gmalla" x1="${ml}" y1="${yy.toFixed(1)}" x2="${A-mr}" y2="${yy.toFixed(1)}"/>`
      +`<text class="getiq" x="${ml-6}" y="${(yy+3).toFixed(1)}" text-anchor="end">${v>=100?Math.round(v):v.toFixed(v<10?1:0)}</text>`}).join('');

  // Como mucho siete fechas abajo: con catorce se pisan entre ellas.
  const paso=Math.max(1,Math.ceil(datos.length/7));
  const fechas=datos.map((d,i)=>i%paso===0||i===datos.length-1
    ? `<text class="getiq" x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${d.dia.slice(8)}/${d.dia.slice(5,7)}</text>`:'').join('');

  const tope=topeCabe
    ? `<line class="gtope" x1="${ml}" y1="${y(o.tope).toFixed(1)}" x2="${A-mr}" y2="${y(o.tope).toFixed(1)}"/>`
      +`<text class="getiq" x="${A-mr}" y="${(y(o.tope)-5).toFixed(1)}" text-anchor="end" style="fill:var(--rojo);opacity:.75">tope de purga</text>`
    : o.tope!=null
    ? `<text class="getiq" x="${A-mr}" y="${mt-4}" text-anchor="end" style="opacity:.8">tope de purga ${Math.round(o.tope)} ${o.unidad} · fuera de escala</text>`:'';

  const puntos=vals.map((v,i)=>
    `<circle class="gpt halo" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4"/>`
    +`<circle class="gpt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="1.5"><title>${datos[i].dia} · ${v.toFixed(2)} ${o.unidad}</title></circle>`).join('');

  const id='g'+Math.random().toString(36).slice(2,8);
  return `<svg class="graf" viewBox="0 0 ${A} ${H}" role="img">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient></defs>
    ${malla}${tope}
    <polygon points="${area}" fill="url(#${id})"/>
    <polyline class="gl halo" points="${linea}"/>
    <polyline class="gl brillo" points="${linea}"/>
    <polyline class="gl nucleo" points="${linea}"/>
    ${puntos}${fechas}
  </svg>`;
}

/* ---------------- usuarios ----------------
   El nombre de usuario se ARMA con la primera letra del apellido más el
   nombre. No se elige a mano para que el registro de auditoría se pueda leer
   sin consultar otra tabla: `fmauricio` se resuelve solo. */
/* ---------------- usuarios ----------------
   Esto era un botón "Usuarios…" dentro de la vista de Auditoría, y así no lo
   encontró nadie: el menú decía "Auditoría", y nada avisaba que las cuentas
   vivieran adentro. Ahora es una sección propia en el menú --visible sólo para
   admin, que es el único que puede tocarla-- y el nombre de la barra lateral
   también lleva acá, porque es donde uno va a hacer clic para buscarse.

   Los permisos se escriben en pantalla a propósito. Quién puede hacer qué es
   una decisión del sistema, no un detalle de implementación, y el que crea una
   cuenta tiene que poder leer lo que le está dando antes de darlo. */
async function vUsuarios(){
  $('#titulo').textContent='Usuarios';

}

  const yo=usuario,us=d.usuarios||[];
  const admins=us.filter(u=>u.rol==='admin').length;
  $('#subtitulo').textContent=`${us.length} ${us.length===1?'cuenta':'cuentas'}`
    +` · ${admins} con permiso de configurar`;

  c.innerHTML=`
    <div class="err" id="uErr"></div>
    <div class="panel" style="padding:0">
      <table class="aud">
        <thead><tr><th>Usuario</th><th>Persona</th><th>Rol</th><th></th></tr></thead>
        <tbody id="uLista">${us.map(u=>`<tr>
          <td class="quien mono">${u.nombre}${u.nombre===yo
            ?' <span style="color:var(--txt4);font-size:10px">(vos)</span>':''}</td>
          <td>${u.nombre_completo||'—'}</td>
          <td><span class="rolet ${u.rol==='admin'?'admin':'op'}">${u.rol}</span></td>
          <td style="text-align:right">${u.nombre===yo?'':
            `<button class="btn" data-borrar="${u.nombre}" style="height:24px;padding:0 9px;`
            +`font-size:10.5px;color:var(--rojo)">Eliminar</button>`}</td>
        </tr>`).join('')}</tbody></table>
    </div>

    <div class="permisos">
      <div class="panel">
        <div class="ptit"><span class="rolet op">operador</span> puede</div>
        <ul class="psi">
          <li>ver el muro en vivo y el plano</li>
          <li>ver las grabaciones de cualquier día</li>
          <li>exportar evidencia, con su huella y su comprobante</li>
          <li>preservar un tramo para que la purga no lo toque</li>
          <li>mover los domos que se pueden mover</li>
        </ul>
        <div class="ptit" style="margin-top:14px">no puede</div>
        <ul class="pno">
          <li>detener la grabación</li>
          <li>eliminar grabaciones ni levantar una preservación</li>
          <li>agregar, modificar ni eliminar cámaras</li>
          <li>cambiar la retención del archivo</li>
          <li>crear usuarios ni ver la auditoría</li>
        </ul>
      </div>
      <div class="panel">
        <div class="ptit"><span class="rolet admin">admin</span> puede, además</div>
        <ul class="psi">
          <li>agregar, modificar y eliminar cámaras y grupos</li>
          <li>iniciar y detener la grabación</li>
          <li>cambiar la retención y purgar el archivo</li>
          <li>levantar preservaciones</li>
          <li>crear y eliminar cuentas</li>
          <li>leer la auditoría completa</li>
        </ul>
        <div class="d" style="margin:14px 0 0">El usuario se arma solo: es la
          primera letra del apellido seguida del nombre. <b>Mauricio
          Figueroa</b> entra como <b class="mono" style="color:var(--ac)">fmauricio</b>.
          Eliminar una cuenta no borra lo que hizo: la auditoría queda.</div>
      </div>
    </div>`;

  $$('#uLista [data-borrar]').forEach(b=>b.onclick=async()=>{
    const u=b.dataset.borrar;

      +`el registro no se borra con la cuenta.`))return;
    try{await api(`/api/usuarios/${encodeURIComponent(u)}`,{method:'DELETE'});
      aviso(`Usuario ${u} eliminado`,'ok');refrescarUsuarios();
    }catch(e){$('#uErr').textContent=e.message}
