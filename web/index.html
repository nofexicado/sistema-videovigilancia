<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Videovigilancia</title>
<!-- Todo se sirve desde el propio servidor. Muchos despliegues viven en una red
     aislada sin salida a internet: con estas dos cosas colgadas de un CDN, la
     tipografía bloqueaba el pintado hasta el timeout y sin hls.js no había ni
     muro ni reproducción. Ver web/vendor/. -->
<link rel="stylesheet" href="/web/vendor/fuentes.css">
<script src="/web/vendor/hls.min.js"></script>
<style>
:root{
  --bg:#08090a; --panel:#0c0d10; --panel2:#101116; --linea:#191a1f; --linea2:#24262d;
  --txt:#eceef1; --txt2:#9599a3; --txt3:#5f636d; --txt4:#464a53;
  --ac:#7b8cf5; --ac2:#9aa6f8; --acd:#3d4a8a;
  --ok:#45b97c; --rojo:#e5484d; --ambar:#d9a441;
  /* Verde de acento de la marca. Vive en :root y no sólo en el skin neón
     porque ya lo usan la barra de lo preservado y los permisos, y un color
     que existe en una piel y no en la otra es un color que un día no
     aplica. */
  --verde:#299f2d; --verde2:#46d94f;
  --curva:cubic-bezier(.22,.68,.28,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--txt);font-family:Geist,-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.008em;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(123,140,245,.10), transparent 62%),
    radial-gradient(880px 520px at 4% 104%, rgba(123,140,245,.055), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.012em}
a{color:var(--ac);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#1e2027;border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#2b2e37;background-clip:content-box}
#app{display:flex;height:100vh;overflow:hidden}

/* ---------- barra lateral ---------- */
aside{
  width:238px;flex-shrink:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(17,18,23,.9),rgba(10,11,13,.9));
  border-right:1px solid var(--linea);backdrop-filter:blur(12px);
}
/* La barra tiene tres partes y solo una puede crecer: la marca arriba y el pie
   abajo quedan clavados, y el arbol del medio se desplaza.

   Sin esto el arbol empujaba el pie fuera de los 100vh de `#app`, que recorta
   con `overflow:hidden` y por lo tanto sin barra de desplazamiento: los GB
   grabados, el volumen y el contacto quedaban abajo, invisibles y sin manera
   de llegar. Medido con los cuatro yacimientos abiertos: el bloque del autor
   terminaba 885 px por debajo del borde de la ventana.

   El pie es lo que siempre tiene que verse --dice cuanto disco queda-- asi que
   es el arbol el que scrollea, no la barra entera. */
.marca,.pie{flex-shrink:0}
.lateral{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
/* Mas finita que la general: 238 px de barra no sobran. */
.lateral::-webkit-scrollbar{width:8px}
/* La marca del sistema va arriba a lo ancho y la bajada debajo, separadas por
   una linea fina; encajarlas de costado en 238px las apretaba a las dos. */
.marca{display:flex;flex-direction:column;gap:9px;padding:15px 15px 13px;border-bottom:1px solid var(--linea)}
.marca .nombre{display:flex;align-items:baseline;gap:7px;padding-top:9px;border-top:1px solid rgba(255,255,255,.05)}
.marca b{font-size:13px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.marca .nombre span{font-size:10px;color:var(--txt3)}

/* Marca de texto en la barra lateral: mismo lugar y el mismo brillo neon que
   tenia el isotipo anterior, sin depender de un logo dibujado a mano.
   `logo.png` se sigue usando en el login si el despliegue deja uno propio. */
.logo-txt{font-size:15px;font-weight:700;line-height:1.18;letter-spacing:-.01em;
  color:#fff;
  filter:drop-shadow(0 0 3px rgba(70,217,79,.5))
         drop-shadow(0 0 12px rgba(41,159,45,.4))
         drop-shadow(0 0 30px rgba(41,159,45,.22));}
/* En la skin clasica el tubo se apaga, como el resto del chrome. */
[data-skin="clasico"] .logo-txt{filter:none;opacity:.95;color:var(--txt)}

/* Credito del autor, al pie de la barra. */
.autor{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05);
  font-size:9.5px;line-height:1.5;color:var(--txt4)}
.autor b{display:block;font-size:10.5px;font-weight:600;color:var(--txt2);letter-spacing:-.01em}
.autor a{display:block;color:var(--txt3);font-size:9.5px;word-break:break-all;margin-top:2px}
.autor a:hover{color:var(--ac)}
nav{display:flex;flex-direction:column;gap:2px;padding:12px 9px}
.nav{
  position:relative;display:flex;align-items:center;gap:10px;padding:0 10px;height:32px;
  border-radius:8px;color:var(--txt2);font-size:12.5px;cursor:pointer;
  transition:background .18s var(--curva),color .18s var(--curva),transform .12s var(--curva);
}
.nav:hover{background:rgba(255,255,255,.038);color:var(--txt)}
.nav:active{transform:scale(.985)}
.nav.on{background:linear-gradient(90deg,rgba(123,140,245,.17),rgba(123,140,245,.05));color:var(--txt);font-weight:500}
.nav.on::before{content:"";position:absolute;left:-9px;top:8px;bottom:8px;width:2.5px;border-radius:0 3px 3px 0;background:var(--ac);box-shadow:0 0 10px rgba(123,140,245,.85)}
.nav svg{opacity:.85;flex-shrink:0}
.nav .n{margin-left:auto;font-size:10.5px;color:var(--txt4);font-family:"Geist Mono",monospace}
.nav.on .n{color:var(--ac)}
.rotulo{padding:16px 17px 8px;font-size:9.5px;font-weight:600;color:var(--txt4);letter-spacing:.1em;text-transform:uppercase}
.sitio{display:flex;align-items:center;gap:9px;padding:0 17px;height:28px;font-size:12px;color:var(--txt2);cursor:pointer;transition:background .16s,color .16s}
.sitio:hover{background:rgba(255,255,255,.03);color:var(--txt)}
.sitio.on{background:rgba(123,140,245,.11);color:var(--txt)}
.sitio .p{width:5px;height:5px;border-radius:1.5px;background:var(--acd);transition:background .2s}
.sitio.on .p,.sitio:hover .p{background:var(--ac)}
.sitio .n{margin-left:auto;font-size:10px;color:var(--txt4);font-family:"Geist Mono",monospace}
/* Árbol de la barra: mismos grupos que el plano, desplegables. La sangría la
   pone el JS con padding-left, así el resaltado de la fila llega hasta el
   borde en cualquier nivel. */
.sitio .chev{width:11px;height:11px;flex-shrink:0;display:grid;place-items:center;
  color:var(--txt4);transition:transform .16s var(--curva),color .16s}
.sitio .chev svg{display:block}
.sitio .chev.abierto{transform:rotate(90deg)}
/* `sinhijos` y no `vacio`: esa clase ya existe para el cartel de los
   recuadros del muro, que es `position:absolute`, y sacaba al chevron del
   flujo dejando las filas sin subgrupos corridas a la izquierda. */
.sitio .chev.sinhijos{opacity:0;pointer-events:none}
.sitio .chev:hover{color:var(--ac)}
.sitio.cam{font-size:11px;color:var(--txt3);height:25px}
.sitio.cam:hover{color:var(--txt)}
.sitio.cam .est{width:5px;height:5px;border-radius:50%;background:var(--txt4);flex-shrink:0}
.sitio.cam .est.on{background:var(--ok);box-shadow:0 0 6px -1px var(--ok)}
.sitio .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitio.suelto{color:var(--txt4);font-style:italic}
.pie{margin-top:auto;padding:14px 15px;border-top:1px solid var(--linea);font-size:11px;color:var(--txt2)}
.barra{height:4px;border-radius:3px;background:#15161b;margin:9px 0;overflow:hidden}
.barra i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acd),var(--ac));transition:width .8s var(--curva);box-shadow:0 0 10px rgba(123,140,245,.45)}

/* ---------- cabecera ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--linea);flex-shrink:0;background:rgba(8,9,10,.55);backdrop-filter:blur(10px)}
h1{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.025em}
.sub{font-size:10.5px;color:var(--txt3);margin-top:1px}
.crece{flex:1}

/* ---------- controles ---------- */
.btn{
  height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;border-radius:8px;
  font-size:11.5px;font-family:inherit;cursor:pointer;white-space:nowrap;color:var(--txt2);
  border:1px solid var(--linea2);background:linear-gradient(180deg,#15171c,#101116);
  transition:all .18s var(--curva);
}
.btn:hover{color:var(--txt);border-color:#33363f;transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(0,0,0,.85)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:linear-gradient(180deg,#8b9bf8,#6a7bef);color:#0a0b12;border-color:#8b9bf8;font-weight:600;box-shadow:0 4px 16px -5px rgba(123,140,245,.55)}
.btn.pri:hover{box-shadow:0 8px 22px -6px rgba(123,140,245,.7)}
.btn.on{color:var(--ok);border-color:rgba(69,185,124,.42);background:linear-gradient(180deg,rgba(69,185,124,.16),rgba(69,185,124,.07));box-shadow:0 0 14px -4px rgba(69,185,124,.5)}
.btn.peligro{color:var(--rojo);border-color:rgba(229,72,77,.28)}
.btn.peligro:hover{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.5)}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
select,input{height:30px;padding:0 10px;background:var(--panel2);border:1px solid var(--linea2);border-radius:8px;color:var(--txt);font-family:inherit;font-size:11.5px;outline:none;transition:border-color .18s,box-shadow .18s}
select:focus,input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(123,140,245,.14)}
label{display:block;font-size:10.5px;color:var(--txt3);margin-bottom:6px}
.campo{margin-bottom:13px}
.campo input,.campo select{width:100%}

/* ---------- entrada / vistas ---------- */
section{flex:1;overflow:auto;padding:20px}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.anim{animation:sube .42s var(--curva) both}
.anim:nth-child(1){animation-delay:.02s}.anim:nth-child(2){animation-delay:.05s}
.anim:nth-child(3){animation-delay:.08s}.anim:nth-child(4){animation-delay:.11s}
.anim:nth-child(5){animation-delay:.14s}.anim:nth-child(6){animation-delay:.17s}
.anim:nth-child(n+7){animation-delay:.2s}

/* ---------- muro ---------- */
/* ---------- barra lateral plegable ---------- */
/* Un solo estado, `#app.sin-lateral`, del que cuelgan las tres consecuencias:
   la barra se va, el botón para traerla vuelve a aparecer, y la cuadrícula
   pasa a cuatro columnas con recuadros más grandes. Repartir esto en flags
   separados es lo que termina dejando la interfaz en estados imposibles. */
aside .ocultar{margin-left:auto;width:20px;height:20px;flex-shrink:0;padding:0;
  display:grid;place-items:center;border-radius:5px;cursor:pointer;
  border:1px solid var(--linea2);background:transparent;color:var(--txt3);
  font-family:inherit;transition:all .18s var(--curva)}
aside .ocultar:hover{color:var(--ac);border-color:var(--ac)}
#app.sin-lateral aside{display:none}
.btn.solo-icono{padding:0;width:30px;justify-content:center;flex-shrink:0}
/* `.btn` declara display:inline-flex y eso le gana al display:none que el
   navegador aplica por el atributo [hidden]: sin esto el botón de mostrar la
   barra se veía incluso con la barra a la vista. */
.btn[hidden]{display:none}

/* ---------- métricas de la cabecera ---------- */
/* Antes esto era una línea de texto gris: "31 transmitiendo · 8/6
   convirtiendo". Lo que el operador necesita saber de un vistazo —cuántas
   graban y si algo se cayó— competía con el resto en el mismo peso visual. */
.metricas{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:3px}
.met{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 9px;
  border-radius:999px;font-size:10.5px;font-family:"Geist Mono",monospace;
  border:1px solid var(--linea2);background:rgba(255,255,255,.02);color:var(--txt2)}
.met b{font-weight:600;color:var(--txt);font-size:11.5px;
  font-variant-numeric:tabular-nums}
.met.vive{border-color:rgba(229,72,77,.4);color:var(--rojo)}
.met.vive b{color:var(--rojo)}
.met.alerta{border-color:rgba(217,164,65,.45);color:var(--ambar)}
.met.alerta b{color:var(--ambar)}
.met.quieta{border-color:rgba(255,255,255,.08);color:var(--txt4)}
.met .lat{width:6px;height:6px;border-radius:50%;background:var(--rojo);
  flex-shrink:0;animation:lat 2s infinite}
.met .ubic{color:var(--ac)}
[data-skin="neon"] .met.vive{box-shadow:0 0 14px -6px var(--rojo)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:11px}
/* Sin la barra, o en pantalla completa: como máximo CUATRO columnas, y los
   recuadros más grandes que con la barra puesta.

   Las dos cosas salen de un solo `max()`. El 23 % impone el tope: cuatro
   pistas ocupan el 92 % y una quinta no entra. El piso de 420 px es lo que
   garantiza que plegar AGRANDE — con el mínimo de 310 px de la vista normal,
   `auto-fill` usaba el ancho liberado para meter una columna más y los
   recuadros terminaban más chicos que antes, exactamente al revés de lo que
   se busca. Con este piso el ancho extra va al tamaño, no a la cantidad. */
#app.sin-lateral .grid,
.grid:fullscreen{grid-template-columns:repeat(auto-fill,minmax(max(23%,420px),1fr));
  gap:13px}
.grid:fullscreen{background:var(--bg);padding:13px;overflow-y:auto;
  align-content:start;
  /* `min-content` y no `auto`, que es lo que rompia la vista.

     Al pasar a pantalla completa el navegador le impone a la cuadricula
     `height:100%!important`. Con las filas en `auto` esa altura se reparte
     entre las filas que haya --once camaras de alto daban 67 px por fila--
     mientras cada recuadro conserva su 16/9 y mide 308 px. Cada fila se
     desbordaba sobre la de abajo y se veian todas las camaras encimadas.

     Con `min-content` la fila mide lo que mide el recuadro, la cuadricula
     crece hacia abajo y el `overflow-y` de arriba la hace desplazable, que
     es lo que se espera de un muro con mas camaras de las que entran. */
  grid-auto-rows:min-content}
/* En pantalla completa el rótulo del recuadro puede crecer: hay lugar. */
.grid:fullscreen .tile .cap b{font-size:12.5px}
.grid:fullscreen .tile .cap .chip{font-size:10px}
.tile{
  position:relative;aspect-ratio:16/9;border-radius:11px;overflow:hidden;
  border:1px solid var(--linea);background:linear-gradient(150deg,#111318,#0a0b0d);
  animation:sube .5s var(--curva) both;
  transition:border-color .26s var(--curva),box-shadow .26s var(--curva),transform .26s var(--curva);
}
.tile:hover{border-color:#3a3d47;transform:translateY(-3px);box-shadow:0 0 0 1px rgba(123,140,245,.22),0 18px 40px -18px rgba(0,0,0,.95)}
.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#07080a}
.cap{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;gap:8px;padding:11px 12px;background:linear-gradient(180deg,rgba(0,0,0,.72),transparent);pointer-events:none}
.cap b{font-size:11.5px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.pin{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s}
.pin.rec{background:var(--rojo);box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:lat 2s infinite}
.pin.off{background:var(--txt4)}
@keyframes lat{0%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}70%{box-shadow:0 0 0 7px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.chip{margin-left:auto;font-size:9px;color:#c9ccd3;background:rgba(8,9,10,.75);border:1px solid rgba(255,255,255,.1);padding:3px 6px;border-radius:5px;backdrop-filter:blur(6px)}
/* Botón de transmisión. Muestra el estado real del grabador; para un admin es
   además el que la corta, y al pasar el mouse lo dice en vez de esconderlo. */
.btn.tx{color:var(--ok);border-color:rgba(69,185,124,.42);
  background:linear-gradient(180deg,rgba(69,185,124,.16),rgba(69,185,124,.07))}
.btn.tx .txDet{display:none}
.btn.tx.puede:hover{color:var(--rojo);border-color:rgba(229,72,77,.5);background:rgba(229,72,77,.12)}
.btn.tx.puede:hover .txVivo{display:none}
.btn.tx.puede:hover .txDet{display:inline}
.btn .punto{width:6px;height:6px;border-radius:50%;background:var(--rojo);
  flex-shrink:0;animation:lat 2s infinite}
/* Cámaras que arrancaron y se cayeron. Va en ámbar y no en rojo a propósito:
   el sistema está grabando, hay una parte que no. El nombre de la caída está
   en el title del botón. */
.btn.tx .txCaidas{color:var(--ambar);font-size:10px;padding-left:7px;
  border-left:1px solid rgba(217,164,65,.3)}
.btn .giro{width:11px;height:11px;border-width:1.4px}
.vacio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:10.5px;color:var(--txt4)}
.giro{width:15px;height:15px;border:1.5px solid #23252c;border-top-color:var(--ac);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- plano ---------- */
/* El lienzo tiene la relación exacta del viewBox del SVG, así que el dibujo
   lo llena sin bandas y los nodos se pueden ubicar en % de la misma caja. */
.plano{position:relative;width:100%;max-width:1200px;margin:0 auto;aspect-ratio:1200/820}
.pmapa{position:absolute;inset:0;width:100%;height:100%}
.ptraza{fill:none;stroke:#fff;stroke-opacity:.28;stroke-width:1}
.ptraza.fina{stroke-opacity:.13;stroke-width:.75}
.penlace{fill:none;stroke:#fff;stroke-opacity:.2;stroke-width:1;stroke-dasharray:5 7}
[data-skin="neon"] .ptraza{filter:drop-shadow(0 0 3px rgba(255,255,255,.55))}
[data-skin="neon"] .ptraza.fina{filter:none}
[data-skin="neon"] .penlace{filter:drop-shadow(0 0 3px rgba(255,255,255,.4))}

.pzona{position:absolute;transform:translate(-50%,-50%);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .3s var(--curva)}
.pzona:hover{transform:translate(-50%,-50%) scale(1.06)}
.pnodo{position:relative;width:58px;height:58px;display:grid;place-items:center;
  border-radius:50%;border:1px solid rgba(255,255,255,.32);
  background:radial-gradient(circle at 50% 40%,rgba(123,140,245,.10),rgba(10,11,13,.9));
  font-family:"Geist Mono",monospace;font-size:16px;font-weight:600;
  transition:all .3s var(--curva)}
.pzona:hover .pnodo{border-color:var(--ac);color:var(--ac2);
  box-shadow:0 0 0 1px rgba(123,140,245,.3),0 0 26px -2px var(--ac)}
.pnodo::after{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1px solid transparent;transition:border-color .3s}
.pzona:hover .pnodo::after{border-color:var(--ac);animation:pulso 1.9s ease-out infinite}
@keyframes pulso{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.36);opacity:0}}
.petiq{text-align:center;pointer-events:none}
.petiq b{display:block;font-size:11.5px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.95)}
.pzona:hover .petiq b{color:var(--ac2)}
.petiq span{font-size:9.5px;color:var(--txt3);font-family:"Geist Mono",monospace}
.pzona.vacia{opacity:.45}
.psrv{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;
  padding:7px 11px;border-radius:8px;border:1px solid rgba(41,159,45,.45);
  background:rgba(10,11,13,.9)}
.psrv b{font-size:10.5px;font-weight:600;color:#46d94f}
.psrv span{font-size:9px;color:var(--txt3);font-family:"Geist Mono",monospace}
[data-skin="neon"] .psrv{box-shadow:0 0 18px -6px rgba(41,159,45,.9)}
.pleyenda{position:absolute;left:0;bottom:-4px;font-size:9.5px;color:var(--txt4)}


/* ---------- plano: modo edición ---------- */
.plano.editando{cursor:default}
.plano.editando .pzona{cursor:grab;touch-action:none}
.plano.editando .pzona:hover{transform:translate(-50%,-50%)}
.plano.editando .pzona:hover .pnodo::after{animation:none;border-color:transparent}
.plano.editando .pnodo{border-style:dashed}
.pzona.arrastrando{cursor:grabbing;z-index:30}
.pzona.arrastrando .pnodo{border-color:var(--ac);border-style:solid;
  box-shadow:0 0 0 1px rgba(0,223,255,.35),0 0 30px -2px var(--ac)}
/* Lapicito para editar el grupo, sólo en modo edición. */
.plapiz{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  display:none;place-items:center;cursor:pointer;padding:0;font-family:inherit;
  border:1px solid var(--linea2);background:var(--panel2);color:var(--txt2)}
.plano.editando .plapiz{display:grid}
.plapiz:hover{color:var(--ac);border-color:var(--ac)}
.pvacio{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center}

/* ---------- selector de cámaras del grupo ---------- */
.modal.ancho{width:620px}
.buscador{margin-bottom:10px}

/* ---------- barra de filtros de la sección Cámaras ---------- */
.filtros{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:13px}
.filtros .separa{flex:1;min-width:12px}
.filtros input{width:250px}
/* Píldora de yacimiento. Es un .btn más bajo y redondeado: el estado activo
   reusa .on para que "filtrado" se lea igual acá que en el resto de la app. */
.chip{height:26px;padding:0 12px;border-radius:999px;font-size:11px;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--txt2);
  border:1px solid var(--linea2);background:linear-gradient(180deg,#15171c,#101116);
  transition:all .18s var(--curva);white-space:nowrap}
.chip:hover{color:var(--txt);border-color:#33363f}
.chip.on{color:var(--ok);border-color:rgba(69,185,124,.42);
  background:linear-gradient(180deg,rgba(69,185,124,.16),rgba(69,185,124,.07))}
.chip .n{font-size:9.5px;color:var(--txt4);font-variant-numeric:tabular-nums}

/* ---------- editor de calidad ---------- */
.cal-cuerpo{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cal-ctrl{display:flex;flex-direction:column;gap:13px}
.cal-fila label{display:block;font-size:10px;color:var(--txt4);letter-spacing:.07em;
  text-transform:uppercase;margin-bottom:5px}
.cal-fila .val{float:right;color:var(--ac);font-variant-numeric:tabular-nums;
  text-transform:none;letter-spacing:0;font-size:11px}
.cal-fila input[type=range]{width:100%;height:22px;padding:0;accent-color:var(--ac);
  background:none;border:none}
/* El panel de proyeccion: lo que va a costar en disco ANTES de aplicarlo. */
.cal-proy{border:1px solid var(--linea);border-radius:10px;padding:14px;
  background:var(--panel2);display:flex;flex-direction:column;gap:12px}
.cal-dato{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cal-dato .k{font-size:10.5px;color:var(--txt3)}
.cal-dato .v{font-size:15px;font-variant-numeric:tabular-nums;color:var(--txt)}
.cal-dato .v small{font-size:10px;color:var(--txt4)}
.cal-flecha{color:var(--txt4);margin:0 5px}
.cal-sube{color:var(--ambar)}
.cal-baja{color:var(--ok)}
.cal-nota{font-size:10px;color:var(--txt4);line-height:1.5}
.cal-medido{font-size:10.5px;color:var(--ok)}
@media (max-width:760px){.cal-cuerpo{grid-template-columns:1fr}}
.chip.on .n{color:var(--ok);opacity:.75}
[data-skin="neon"] .chip.on{color:var(--ac);border-color:rgba(0,223,255,.45);
  background:linear-gradient(180deg,rgba(0,223,255,.16),rgba(0,223,255,.06))}
[data-skin="neon"] .chip.on .n{color:var(--ac)}
.lista-cam{max-height:44vh;overflow:auto;border:1px solid var(--linea);border-radius:9px}
.grupo-sitio{padding:7px 12px;font-size:9.5px;font-weight:600;color:var(--txt4);
  letter-spacing:.09em;text-transform:uppercase;background:var(--panel2);
  position:sticky;top:0;z-index:1}
.fila-cam{display:flex;align-items:center;gap:9px;padding:7px 12px;font-size:11.5px;
  color:var(--txt2);cursor:pointer;border-top:1px solid var(--linea)}
.fila-cam:hover{background:rgba(123,140,245,.06);color:var(--txt)}
[data-skin="neon"] .fila-cam:hover{background:rgba(0,223,255,.06)}
.fila-cam input{width:14px;height:14px;flex-shrink:0;accent-color:var(--ac);margin:0}
.fila-cam .est{width:5px;height:5px;border-radius:50%;background:var(--txt4);flex-shrink:0}
.fila-cam .est.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.fila-cam .otro{margin-left:auto;font-size:9px;color:var(--txt4);white-space:nowrap}
.cuenta-sel{font-size:10.5px;color:var(--txt3);margin:10px 0 2px}

/* ---------- plano: locación abierta (órbita) ---------- */
.orbita{position:absolute;inset:0;z-index:40}
.ovelo{position:absolute;inset:0;background:rgba(4,5,7,.74);backdrop-filter:blur(3px);
  animation:vela .3s var(--curva) both}
@keyframes vela{from{opacity:0}to{opacity:1}}
.ocaja{position:absolute;inset:16px}
.ohilos{position:absolute;inset:0;width:100%;height:100%}
.ohilo{stroke:#fff;stroke-opacity:.24;stroke-width:1;
  stroke-dasharray:600;stroke-dashoffset:600;
  animation:tira .55s var(--curva) both}
[data-skin="neon"] .ohilo{filter:drop-shadow(0 0 3px rgba(255,255,255,.5))}
@keyframes tira{to{stroke-dashoffset:0}}
.ocubo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:15px 22px;border-radius:13px;border:1px solid var(--ac);
  background:rgba(10,11,13,.95);animation:entraCubo .38s var(--curva) both}
[data-skin="neon"] .ocubo{box-shadow:0 0 34px -10px var(--ac)}
@keyframes entraCubo{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}
                     to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.ocubo b{font-size:14px;font-weight:600;letter-spacing:-.025em}
.ocubo span{font-size:10px;color:var(--txt3);font-family:"Geist Mono",monospace}
.ocerrar{position:absolute;top:-13px;right:-13px;width:26px;height:26px;border-radius:50%;
  border:1px solid rgba(229,72,77,.5);background:var(--bg);color:var(--rojo);
  display:grid;place-items:center;cursor:pointer;font-size:14px;line-height:1;padding:0;
  font-family:inherit}
.ocerrar:hover{box-shadow:0 0 16px -3px var(--rojo)}
.ocam{position:absolute;width:150px;border-radius:9px;overflow:hidden;
  border:1px solid var(--linea2);background:var(--panel);cursor:pointer;
  animation:entraCam .42s var(--curva) both}
@keyframes entraCam{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}
                    to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.ocam:hover{border-color:var(--ac)}
[data-skin="neon"] .ocam:hover{box-shadow:0 0 0 1px rgba(0,223,255,.3),0 0 26px -8px var(--ac)}
.ocam .marco{height:84px;position:relative;background:#07080a}
.ocam video{width:100%;height:100%;object-fit:cover;display:block}
.ocam .vacio{font-size:9px;gap:6px}
.ocam .pie{padding:6px 9px;border-top:1px solid var(--linea);display:flex;align-items:center;gap:6px;
  font-size:8.5px;color:var(--txt2);font-family:"Geist Mono",monospace}
.ocam .pie b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocam .pin{flex-shrink:0}
/* Cierre. Tienen que ser keyframes DISTINTOS, no los de entrada con
   `reverse`: el navegador no reinicia una animación si el animation-name no
   cambia, así que reusarlos hacía que la órbita desapareciera de golpe. */
@keyframes saleVelo{to{opacity:0}}
@keyframes saleCubo{to{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
@keyframes saleCam{to{opacity:0;transform:translate(-50%,-50%) scale(.78)}}
@keyframes saleHilo{to{stroke-dashoffset:600;opacity:0}}
.orbita.cerrando{pointer-events:none}
.orbita.cerrando .ovelo{animation:saleVelo .26s var(--curva) both}
.orbita.cerrando .ocubo{animation:saleCubo .26s var(--curva) both}
/* Se van de afuera hacia adentro, al revés de como entraron. */
.orbita.cerrando .ocam{animation:saleCam .26s var(--curva) both}
.orbita.cerrando .ohilo{animation:saleHilo .3s var(--curva) both}

/* ---------- superficies ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px;margin-bottom:18px}
.card,.panel{
  background:linear-gradient(165deg,rgba(24,26,32,.62),rgba(12,13,16,.62));
  border:1px solid var(--linea);border-radius:13px;backdrop-filter:blur(8px);
  transition:border-color .24s var(--curva),transform .24s var(--curva),box-shadow .24s var(--curva);
}
.card{padding:16px 18px}
.card:hover{border-color:var(--linea2);transform:translateY(-2px);box-shadow:0 14px 34px -20px rgba(0,0,0,.95)}
.card .k{font-size:11px;color:var(--txt3)}
.card .v{font-size:27px;font-weight:600;letter-spacing:-.04em;margin-top:8px;background:linear-gradient(180deg,#fff,#b9bec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .h{font-size:10.5px;color:var(--txt3);margin-top:5px}
.panel{padding:18px;margin-bottom:16px}
.aviso{font-size:12px;color:var(--txt2);line-height:1.65}

/* ---------- tablas ---------- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9.5px;font-weight:600;color:var(--txt4);letter-spacing:.09em;text-transform:uppercase;padding:0 14px 10px}
td{padding:11px 14px;border-top:1px solid var(--linea);color:var(--txt2)}
tbody tr{transition:background .16s}
tbody tr:hover{background:rgba(123,140,245,.05)}
.tag{font-size:9.5px;padding:2.5px 7px;border-radius:5px;border:1px solid var(--linea2);color:var(--txt2);white-space:nowrap}
.tag.v{color:var(--ac);border-color:rgba(123,140,245,.32);background:rgba(123,140,245,.1)}
.tag.r{color:var(--rojo);border-color:rgba(229,72,77,.32);background:rgba(229,72,77,.1)}
.tag.a{color:var(--ambar);border-color:rgba(217,164,65,.32);background:rgba(217,164,65,.1)}
.tag.g{color:var(--ok);border-color:rgba(69,185,124,.32);background:rgba(69,185,124,.1)}

/* ---------- reproducción ---------- */
.visor{position:relative;background:#000;border:1px solid var(--linea);border-radius:13px;overflow:hidden;aspect-ratio:16/9;max-height:50vh;margin:0 auto;box-shadow:0 22px 55px -28px rgba(0,0,0,1)}
/* Armar la ventana puede tardar unos segundos cuando hay que convertir H.265.
   Un <video> mudo mientras tanto se lee como "esto no anda".

   El `[hidden]` explicito NO es redundante: `display:flex` de esta misma regla
   le gana al `[hidden]{display:none}` de la hoja del navegador, asi que sin
   esto la capa quedaba SIEMPRE puesta. Con 72% de negro encima, el video se
   veia oscuro y ademas los controles nativos no recibian el click -- de ahi
   que no anduviera el boton de pantalla completa. */
.vmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;font-size:11.5px;color:var(--txt3);
  background:rgba(6,7,9,.72);backdrop-filter:blur(2px);text-align:center;padding:0 24px;
  z-index:2}
.vmsg[hidden]{display:none}
.vmsg .giro{width:20px;height:20px}
.vmsg b{color:var(--txt);font-weight:500}
/* En pantalla completa el visor tiene que ocupar todo: sin esto se queda con
   el `aspect-ratio` y el `max-height:50vh` del muro y sale una tira chica en
   el medio de una pantalla negra. */
.visor:fullscreen{max-height:none;width:100vw;height:100vh;border:none;border-radius:0;aspect-ratio:auto}
.visor:fullscreen video{width:100%;height:100%;object-fit:contain}

/* Pantalla completa de una cámara. En el muro basta con soltar el recorte;
   en el plano hace falta bastante más.

   El recuadro de la órbita mide 150 px, está posicionado con left/top y queda
   centrado sobre su punto por el transform con el que TERMINA su animación
   de entrada (entraCam, con fill both). Nada de eso lo pisa el navegador
   al pasar a pantalla completa: las reglas de autor le ganan a la hoja del
   navegador, y el estado final de una animación le gana a una regla normal.
   Sin los !important se veía una miniatura de 150 px corrida 75 px a la
   izquierda y 55 hacia arriba, sobre fondo negro. */
.tile:fullscreen video{object-fit:contain}
.ocam:fullscreen{
  width:100%!important;height:100%!important;
  left:0!important;top:0!important;
  transform:none!important;animation:none!important;
  border:none;border-radius:0;background:#000;cursor:default}
.ocam:fullscreen .marco{height:100%!important}
.ocam:fullscreen video{object-fit:contain}
.ocam:fullscreen .vacio{font-size:12px;gap:10px}
/* El pie pasa a flotar sobre la imagen: con el marco al 100% ya no hay lugar
   debajo, y perder el nombre de la cámara en pantalla completa es justo cuando
   más importa saber cuál se está mirando. */
.ocam:fullscreen .pie{position:absolute;left:0;right:0;bottom:0;border:none;
  font-size:12px;padding:14px 18px;
  background:linear-gradient(0deg,rgba(0,0,0,.8),transparent)}
.visor video{width:100%;height:100%;display:block;background:#000}
/* Dos carriles separados: arriba la grabacion, abajo los eventos. Antes se
   pisaban y no se podia apuntar a ninguno de los dos. Toda la pista es
   clickeable, asi que no hace falta acertarle a un segmento de 1 pixel. */
.pista{position:relative;height:62px;background:linear-gradient(180deg,#0e0f13,#0a0b0e);border:1px solid var(--linea);border-radius:8px;margin-top:10px;cursor:crosshair;overflow:hidden}
.carril{position:absolute;left:0;right:0;pointer-events:none}
.carril.rec{top:7px;height:26px}
/* El carril de eventos tiene fondo propio para que se lea como un carril y no
   como un hueco negro debajo de la grabacion. */
.carril.evs{top:37px;height:16px;background:rgba(255,255,255,.028);
  border-radius:3px;overflow:hidden}
.seg{position:absolute;top:0;height:26px;border-radius:3px;background:linear-gradient(180deg,#4d5da8,#3a468a);pointer-events:none}
/* Sin sombra: cien marcas con halo difuso se funden en una mancha borrosa que
   parece suciedad. Barras solidas, y las que caen juntas se agrupan en una. */
.mev{position:absolute;top:2px;height:12px;min-width:3px;border-radius:2px;background:#e8756f;
  cursor:pointer;pointer-events:auto;transition:background .14s,transform .14s var(--curva)}
.mev:hover{background:#fff;transform:scaleY(1.2);z-index:5}
.mev.varios{background:linear-gradient(180deg,#f08b85,#d4544f)}
.cursor{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;box-shadow:0 0 10px rgba(255,255,255,.85);transition:left .25s linear;z-index:3}
.cursor::before{content:"";position:absolute;top:-1px;left:-4px;width:10px;height:10px;background:#fff;border-radius:50%;box-shadow:0 0 10px rgba(255,255,255,.9)}
.fantasma{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.3);pointer-events:none;opacity:0;z-index:2}
.pista:hover .fantasma{opacity:1}
.reloj{position:absolute;top:2px;transform:translateX(-50%);font-size:9.5px;font-family:"Geist Mono",monospace;
  color:#fff;background:rgba(8,9,11,.9);border:1px solid var(--linea2);border-radius:4px;padding:1px 5px;
  pointer-events:none;opacity:0;white-space:nowrap;z-index:4}
.pista:hover .reloj{opacity:1}
.horas{display:flex;justify-content:space-between;margin-top:7px}
.horas span{font-size:9px;color:var(--txt4);font-family:"Geist Mono",monospace}

/* ---------- eventos ---------- */
.ev{display:flex;gap:13px;padding:13px 15px;border-radius:11px;border:1px solid var(--linea);background:linear-gradient(150deg,rgba(24,26,32,.5),rgba(12,13,16,.5));margin-bottom:8px;transition:all .2s var(--curva);animation:sube .4s var(--curva) both}
.ev:hover{border-color:var(--linea2);transform:translateX(3px)}
.ev .bd{width:3px;border-radius:3px;flex-shrink:0}
.ev .cuerpo{flex:1;min-width:0}
.ev .t1{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}
.ev .t2{font-size:11px;color:var(--txt3)}
.ev{cursor:pointer}
/* Un JPEG del clip, no un <video>: el <video> quedaba en negro porque el
   navegador no decodifica MPEG-TS suelto. */
.ev .mini{width:150px;height:85px;object-fit:cover;border-radius:7px;flex-shrink:0;
  background:#0d0e12;border:1px solid var(--linea);display:block}
.ev .mini.rota{position:relative;background:
  repeating-linear-gradient(135deg,#101218 0 7px,#0c0d11 7px 14px)}
.ev .mini.rota::after{content:"sin vista previa";position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;font-size:9.5px;color:var(--txt4)}

/* ---------- gráficos ----------
   Neón blanco con la misma técnica que el contorno del plano: TRES trazos
   superpuestos de la misma polilínea —halo ancho y difuso, brillo medio,
   núcleo fino casi blanco—. Es como funciona un tubo real: el vidrio brilla,
   el gas adentro es blanco. Un solo trazo con `drop-shadow` da una línea con
   sombra, que no es lo mismo. */
.graf{width:100%;height:auto;display:block}
.gl{fill:none;stroke-linejoin:round;stroke-linecap:round}
.gl.halo{stroke:#fff;stroke-width:8;opacity:.10;filter:blur(6px)}
.gl.brillo{stroke:#fff;stroke-width:2.4;opacity:.32;filter:blur(2.2px)}
.gl.nucleo{stroke:#fff;stroke-width:1.25;opacity:.94}
[data-skin="clasico"] .gl.halo{opacity:.04}
[data-skin="clasico"] .gl.brillo{opacity:.14}
[data-skin="clasico"] .gl.nucleo{opacity:.62}
.gmalla{stroke:#fff;stroke-opacity:.055;stroke-width:.7}
.gtope{fill:none;stroke:var(--rojo);stroke-width:.9;stroke-dasharray:5 4;opacity:.6}
.gpt{fill:#fff}
.gpt.halo{opacity:.22;filter:blur(2.5px)}
.getiq{fill:var(--txt4);font-size:8.5px;font-family:"Geist Mono",monospace}
.gtit{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.gtit b{font-size:12px;font-weight:500}
.gtit span{font-size:10.5px;color:var(--txt3)}
/* ---------- retencion ----------
   Cada opcion dice los dias Y lo que ocuparia en disco. Elegir retencion sin
   ver el costo es elegir a ciegas: asi se llego a "14 dias" sin que nadie
   recordara de donde salia el numero. */
.ret{display:flex;flex-direction:column;gap:13px;padding:16px 17px}
.ret-cab{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.ret-cab b{font-size:13px;color:var(--txt)}
.ret-cab span{font-size:10.5px;color:var(--txt3)}
.ret-ops{display:flex;flex-wrap:wrap;gap:7px}
.ret-op{display:flex;flex-direction:column;gap:2px;padding:8px 13px;border-radius:9px;
  border:1px solid var(--linea2);background:var(--panel2);color:var(--txt2);
  font-family:inherit;text-align:left;cursor:pointer;transition:all .18s var(--curva)}
.ret-op b{font-size:14px;color:var(--txt);font-variant-numeric:tabular-nums}
.ret-op span{font-size:9.5px;font-family:"Geist Mono",ui-monospace,monospace;color:var(--txt4)}
.ret-op:hover:not(:disabled){border-color:var(--acd);color:var(--txt)}
.ret-op.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.ret-op.on b,.ret-op.on span{color:var(--ac)}
[data-skin="neon"] .ret-op.on{box-shadow:0 0 17px -7px var(--ac)}
/* Las que no entran se muestran igual: saber que 60 dias NO entran es tan
   util como saber que 30 si. */
.ret-op.noentra{opacity:.42;cursor:not-allowed}
.ret-op.noentra b{color:var(--rojo)}
.ret-op:disabled{cursor:default}
.ret-nota{font-size:11px;line-height:1.55;color:var(--txt3);padding:10px 12px;
  border-radius:8px;border-left:2px solid var(--ambar);
  background:color-mix(in srgb,var(--ambar) 8%,transparent)}
.ret-nota b{color:var(--ambar)}
.ret-nota b.ok{color:var(--ac)}

.gcaja{padding:15px 16px 9px}
.gpar{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media (max-width:900px){.gpar{grid-template-columns:1fr}}
.gvacio{height:120px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;color:var(--txt4)}

/* ---------- menú contextual ----------
   Click derecho sobre un recuadro de cámara. Se posiciona en el punto del
   puntero pero acotado a la ventana, si no se sale de pantalla al abrirlo
   cerca del borde de abajo. */
.menuctx{position:fixed;z-index:80;min-width:206px;padding:5px;
  background:linear-gradient(165deg,#15171d,#0d0e12);border:1px solid #2a2d35;
  border-radius:11px;box-shadow:0 22px 50px -18px rgba(0,0,0,1);
  animation:sube .14s var(--curva) both}
.menuctx .mi{display:flex;align-items:center;gap:9px;width:100%;height:29px;
  padding:0 10px;border:0;border-radius:7px;background:none;cursor:pointer;
  color:var(--txt2);font-family:inherit;font-size:11.5px;text-align:left}
.menuctx .mi:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.menuctx .mi.peligro{color:var(--rojo)}

/* Aviso corto, abajo a la derecha. Para acciones que no abren un modal y no
   cambian nada visible en el acto: sin esto, apretar "Relanzar" no daba ninguna
   señal y parecía que no había hecho nada. */
.aviso{position:fixed;right:20px;bottom:20px;z-index:90;max-width:340px;
  padding:11px 15px;border-radius:10px;font-size:11.5px;line-height:1.45;
  border:1px solid var(--linea2);background:var(--panel);color:var(--txt2);
  box-shadow:0 12px 30px -12px rgba(0,0,0,.9);
  animation:entraAviso .3s var(--curva) both}
.aviso.ok{border-color:rgba(69,185,124,.45);color:var(--ok)}
.aviso.mal{border-color:rgba(229,72,77,.45);color:var(--rojo)}
@keyframes entraAviso{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.menuctx .mi.peligro:hover{background:rgba(229,72,77,.12)}
.menuctx .mi:disabled{opacity:.35;cursor:default}
.menuctx .sep{height:1px;margin:5px 8px;background:var(--linea2)}
.menuctx .cab{padding:6px 10px 7px;font-size:10px;color:var(--txt4);
  border-bottom:1px solid var(--linea);margin-bottom:5px}
.menuctx .cab b{display:block;font-size:11.5px;color:var(--txt);font-weight:500}

/* ---------- nodos de subgrupo dentro de la órbita ---------- */
.osub{position:absolute;width:118px;display:flex;flex-direction:column;
  align-items:center;gap:7px;cursor:pointer;transform:translate(-50%,-50%);
  animation:entraCam .34s var(--curva) both}
.osub .nodo{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;
  border:1px solid rgba(255,255,255,.32);
  background:radial-gradient(circle at 50% 40%,rgba(123,140,245,.12),rgba(10,11,13,.92));
  font-family:"Geist Mono",monospace;font-size:17px;font-weight:600;
  transition:all .25s var(--curva)}
.osub:hover .nodo{border-color:var(--ac);color:var(--ac2);
  box-shadow:0 0 0 1px rgba(123,140,245,.3),0 0 26px -2px var(--ac)}
.osub .et{text-align:center;font-size:10.5px;line-height:1.35}
.osub .et b{display:block;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.95)}
.osub .et span{font-size:9px;color:var(--txt3);font-family:"Geist Mono",monospace}
.migas{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--txt3);
  margin-bottom:5px;flex-wrap:wrap;justify-content:center}
.migas a{cursor:pointer;color:var(--txt3)}
.migas a:hover{color:var(--ac)}

/* ---------- modal ---------- */
/* ---------- auditoría ----------
   Una tabla densa a propósito: lo que se hace acá es recorrer con la vista
   buscando algo que no cierra, y para eso conviene que entren muchas líneas. */
.aud{width:100%;border-collapse:collapse;font-size:12.5px}
.aud th{position:sticky;top:0;background:var(--panel2);text-align:left;
  font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--txt4);padding:9px 12px;border-bottom:1px solid var(--linea)}
.aud td{padding:7px 12px;border-bottom:1px solid var(--linea);color:var(--txt2);
  vertical-align:top}
.aud tr:last-child td{border-bottom:none}
.aud .cuando{font-family:"Geist Mono",monospace;font-size:11px;color:var(--txt3);
  white-space:nowrap}
.aud .quien{color:var(--txt);white-space:nowrap}
.aud .quien small{display:block;color:var(--txt4);font-size:9.5px}
.aud .ip{font-family:"Geist Mono",monospace;font-size:10.5px;color:var(--txt4);
  white-space:nowrap}
/* Las que se llevan o borran material van marcadas: son las que uno busca. */
.aud tr.grave td{background:rgba(229,72,77,.05)}
.aud tr.grave .que{color:var(--rojo)}
.aud tr.fallo .que{color:var(--ambar)}
.rolet{font-size:9px;text-transform:uppercase;letter-spacing:.07em;
  padding:1px 6px;border-radius:4px;margin-left:6px}
.rolet.admin{background:rgba(123,140,245,.16);color:var(--ac)}
.rolet.op{background:rgba(217,164,65,.14);color:var(--ambar)}

/* ---------- permisos, escritos donde se crean las cuentas ---------- */
.permisos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}
.permisos .ptit{font-size:11px;color:var(--txt3);display:flex;align-items:center;
  gap:7px;margin-bottom:9px}
.permisos .ptit .rolet{margin-left:0}
.permisos ul{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.75}
.permisos li{color:var(--txt2);padding-left:17px;position:relative}
.permisos .psi li:before{content:'';position:absolute;left:2px;top:8px;width:7px;
  height:7px;border-radius:2px;background:var(--verde2)}
.permisos .pno li{color:var(--txt3)}
.permisos .pno li:before{content:'';position:absolute;left:2px;top:11px;width:7px;
  height:1.5px;background:var(--rojo)}

/* ---------- tramo preservado en la línea de tiempo ---------- */
.carril.pres{top:2px;height:5px;opacity:.95}
.pres-r{position:absolute;top:0;height:100%;border-radius:2px;
  background:linear-gradient(180deg,#46d94f,#1d8f27);
  box-shadow:0 0 6px rgba(70,217,79,.5)}

/* ---------- PTZ ----------
   En el centro del mando va la IMAGEN de la cámara, no un botón. Antes ahí
   decía "PARAR" y la cámara quedaba tapada por el propio modal: se movía a
   ciegas, se cerraba el mando para ver cómo había quedado, se volvía a abrir,
   y así hasta acertar. Las flechas rodean la imagen porque la dirección que
   uno aprieta está justo del lado hacia el que quiere ir. */
.ptz-marco{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;
  grid-template-rows:42px auto 42px;gap:5px;margin:2px 0 11px}
.ptz-marco button{border:1px solid var(--linea2);border-radius:9px;
  background:linear-gradient(180deg,#15171c,#101116);color:var(--txt2);
  font-size:15px;cursor:pointer;font-family:inherit;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s var(--curva),border-color .12s var(--curva),
             color .12s var(--curva)}
.ptz-marco button:hover{border-color:var(--ac);color:var(--ac)}
.ptz-marco button.tocando{background:rgba(123,140,245,.22);
  border-color:var(--ac);color:var(--ac)}
/* La caja arranca en 16:9 y después toma la forma real de la foto: estos
   domos entregan 4:3, y en una caja 16:9 la imagen quedaba chica, con una
   franja negra al costado y --lo peor-- la cruz del centro cayendo fuera del
   centro de la imagen, que es justo lo que la cruz existe para marcar. */
.ptz-ojo{position:relative;aspect-ratio:16/9;background:#04050a;overflow:hidden;
  border:1px solid var(--linea2);border-radius:10px;cursor:crosshair}
.ptz-ojo img,.ptz-ojo video{position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block}
/* La cruz del centro es la referencia para encuadrar: sin algo fijo en la
   imagen no hay forma de saber si ya quedó centrado lo que uno quiere. */
.ptz-mira{position:absolute;inset:0;pointer-events:none}
.ptz-mira:before,.ptz-mira:after{content:"";position:absolute;
  /* El contorno oscuro no es adorno: sobre un patio al sol una cruz blanca al
     50% no se ve, y una referencia que desaparece justo cuando hay luz no
     sirve de referencia. */
  background:rgba(255,255,255,.82);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.ptz-mira:before{left:50%;top:calc(50% - 13px);width:1px;height:26px}
.ptz-mira:after{top:50%;left:calc(50% - 13px);height:1px;width:26px}
.ptz-sello{position:absolute;left:8px;top:8px;display:flex;align-items:center;
  gap:6px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--txt3);background:rgba(4,5,10,.74);border:1px solid var(--linea);
  border-radius:6px;padding:3px 7px;pointer-events:none}
.ptz-sello i{width:5px;height:5px;border-radius:50%;background:var(--ok);flex:none}
.ptz-sello.mov{color:var(--ac);border-color:var(--acd)}
.ptz-sello.mov i{background:var(--ac);animation:aparece .85s ease-in-out infinite alternate}
.ptz-espera{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:11px;color:var(--txt3)}

/* El acercar y alejar es lo que más se usa y lo que peor estaba: dos renglones
   de texto chico. Ahora son dos botones grandes a los costados de la
   velocidad, y además andan con la rueda del mouse sobre la imagen y con las
   teclas + y −. La velocidad existe por el zoom: encuadrar de lejos necesita
   pasos finos, y a velocidad normal el domo se pasa de largo siempre. */
.ptz-zona{display:flex;gap:8px;align-items:stretch}
.ptz-z{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
  height:44px;border:1px solid var(--linea2);border-radius:10px;color:var(--txt);
  background:linear-gradient(180deg,#15171c,#101116);font-size:12px;
  font-family:inherit;cursor:pointer;touch-action:none}
.ptz-z:hover{border-color:var(--ac);color:var(--ac)}
.ptz-z.tocando{background:rgba(123,140,245,.22);border-color:var(--ac);color:var(--ac)}
.ptz-vel{display:flex;height:44px;border:1px solid var(--linea2);
  border-radius:10px;overflow:hidden;flex:none}
.ptz-vel button{padding:0 13px;font-size:11px;background:transparent;border:0;
  color:var(--txt3);cursor:pointer;font-family:inherit}
.ptz-vel button:hover{color:var(--txt2)}
.ptz-vel button.on{background:rgba(123,140,245,.16);color:var(--ac)}
.ptz-pre{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ptz-pre button{font-size:11px;padding:5px 11px;border-radius:7px;
  border:1px solid var(--linea2);background:var(--panel2);color:var(--txt2);
  cursor:pointer;font-family:inherit}
.ptz-pre button:hover{border-color:var(--ac);color:var(--ac)}

/* ---------- exportación ---------- */
.huella{font-family:"Geist Mono",monospace;font-size:10px;color:var(--txt3);
  word-break:break-all;line-height:1.5;background:var(--panel2);
  border:1px solid var(--linea);border-radius:6px;padding:8px 10px;margin-top:8px}

.fondo{position:fixed;inset:0;background:rgba(4,5,7,.76);display:flex;align-items:center;justify-content:center;z-index:60;backdrop-filter:blur(6px);animation:aparece .2s ease both}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(165deg,#15171d,#0d0e12);border:1px solid #2a2d35;border-radius:16px;padding:24px;width:480px;max-height:86vh;overflow:auto;box-shadow:0 34px 80px -26px rgba(0,0,0,1);animation:sube .32s var(--curva) both}
.modal h2{font-size:15px;margin:0 0 5px;letter-spacing:-.025em}
/* `.d` es el texto que explica lo que hay arriba. Estaba definido sólo dentro
   de `.modal`, así que en una vista heredaba los 14 px del cuerpo y pesaba más
   que el contenido que venía a explicar. */
.d{font-size:11.5px;color:var(--txt3);line-height:1.55}
.modal .d{font-size:11.5px;color:var(--txt3);margin-bottom:18px;line-height:1.55}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.err{font-size:11.5px;color:var(--rojo);margin-bottom:11px;min-height:15px}
.vacio-grande{text-align:center;padding:52px 20px;color:var(--txt3)}
.vacio-grande h3{font-size:14px;color:var(--txt2);margin:14px 0 7px;font-weight:500}
.vacio-grande p{font-size:12px;line-height:1.65;max-width:430px;margin:0 auto}

/* ============================================================
   SKIN NEÓN
   ============================================================
   Todo el brillo va en el "chrome" —barra, botones, tablas, línea de
   tiempo— y NADA sobre el video. Es una pantalla que alguien mira ocho
   horas seguidas: un halo encima de 27 recuadros cansa la vista y tapa
   justo lo que hay que mirar. Los recuadros se quedan neutros, con el
   neón sólo en el borde cuando pasás por arriba.

   Se cambia con el selector de abajo a la izquierda y queda guardado en
   el navegador. No agrega ninguna dependencia: son variables y sombras. */
[data-skin="neon"]{
  --bg:#04050a; --panel:#080a12; --panel2:#0b0e18; --linea:#151b2d; --linea2:#212b42;
  --txt:#e8f6ff; --txt2:#8ba1bd; --txt3:#586a85; --txt4:#3d4b62;
  --ac:#00dfff; --ac2:#6cf0ff; --acd:#0a6478;
  --ok:#20f0a0; --rojo:#ff3d6e; --ambar:#ffc24a;
  --mag:#ff2fb0;
  /* Verde de acento de la marca: #299f2d.
     El claro es el mismo subido en brillo, para el halo. */
  --verde:#299f2d; --verde2:#46d94f;
}
[data-skin="neon"] body{
  background:
    radial-gradient(1150px 640px at 80% -14%, rgba(0,223,255,.13), transparent 62%),
    radial-gradient(900px 540px at 2% 106%, rgba(255,47,176,.10), transparent 60%),
    var(--bg);
}
/* Retícula tenue de fondo. Va enmascarada para que se desvanezca hacia
   abajo y no compita con el contenido. */
[data-skin="neon"] body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,223,255,.032) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,223,255,.032) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% -10%,#000,transparent 70%);
  mask-image:radial-gradient(circle at 50% -10%,#000,transparent 70%);
}
[data-skin="neon"] #app{position:relative;z-index:1}

/* -- barra lateral -- */
[data-skin="neon"] aside{
  background:linear-gradient(180deg,rgba(9,13,24,.92),rgba(4,5,10,.92));
  border-right:1px solid rgba(0,223,255,.14);
  box-shadow:1px 0 22px -12px rgba(0,223,255,.5);
}
[data-skin="neon"] .nav.on{background:linear-gradient(90deg,rgba(0,223,255,.16),rgba(255,47,176,.05))}
[data-skin="neon"] .nav.on::before{
  background:linear-gradient(180deg,var(--ac),var(--mag));
  box-shadow:0 0 12px var(--ac),0 0 26px rgba(0,223,255,.55);
}
[data-skin="neon"] .sitio.on{background:rgba(0,223,255,.1)}
[data-skin="neon"] .sitio.on .p,[data-skin="neon"] .sitio:hover .p{
  background:var(--ac);box-shadow:0 0 8px var(--ac)}
[data-skin="neon"] .barra i{
  background:linear-gradient(90deg,var(--ac),var(--mag));
  box-shadow:0 0 14px rgba(0,223,255,.6)}

/* -- botones -- */
[data-skin="neon"] .btn{
  background:linear-gradient(180deg,rgba(16,22,38,.9),rgba(8,11,20,.9));
  border-color:rgba(0,223,255,.2)}
[data-skin="neon"] .btn:hover{
  color:var(--ac2);border-color:var(--ac);
  box-shadow:0 0 0 1px rgba(0,223,255,.28),0 0 20px -4px rgba(0,223,255,.65)}
/* La acción principal es el verde de la marca, en un solo tono: el degradé
   de tres colores que tenía antes leía como un botón de otra aplicación. */
[data-skin="neon"] .btn.pri{
  background:linear-gradient(160deg,#3cc945,var(--verde));
  color:#02150a;border-color:rgba(70,217,79,.6);font-weight:600;
  box-shadow:0 0 20px -4px rgba(41,159,45,.95),0 0 40px -12px rgba(70,217,79,.6)}
[data-skin="neon"] .btn.pri:hover{
  color:#02150a;border-color:var(--verde2);
  box-shadow:0 0 28px -2px rgba(70,217,79,.95),0 0 54px -10px rgba(41,159,45,.85)}
/* El ahorro va en cian y no en verde: dos verdes al lado se pisan. */
[data-skin="neon"] .btn.on{
  color:var(--ac);border-color:rgba(0,223,255,.5);
  background:linear-gradient(180deg,rgba(0,223,255,.16),rgba(0,223,255,.05));
  box-shadow:0 0 18px -4px rgba(0,223,255,.7)}
[data-skin="neon"] select:focus,[data-skin="neon"] input:focus{
  border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,223,255,.16),0 0 16px -6px var(--ac)}

/* -- superficies -- */
[data-skin="neon"] .card,[data-skin="neon"] .panel,[data-skin="neon"] .ev{
  background:linear-gradient(165deg,rgba(14,20,35,.6),rgba(6,8,15,.6));
  border-color:rgba(0,223,255,.11)}
[data-skin="neon"] .card:hover{
  border-color:rgba(0,223,255,.34);
  box-shadow:0 0 24px -12px rgba(0,223,255,.7),0 14px 34px -20px #000}
[data-skin="neon"] .card .v{
  background:linear-gradient(100deg,#fff,var(--ac2) 55%,var(--mag));
  -webkit-background-clip:text;background-clip:text}
[data-skin="neon"] .ev:hover{border-color:rgba(0,223,255,.32)}
[data-skin="neon"] tbody tr:hover{background:rgba(0,223,255,.055)}
[data-skin="neon"] .tag.v{color:var(--ac);border-color:rgba(0,223,255,.36);background:rgba(0,223,255,.1)}

/* -- muro: el video se queda quieto, el brillo va en el borde -- */
[data-skin="neon"] .tile{border-color:rgba(0,223,255,.1)}
[data-skin="neon"] .tile:hover{
  border-color:rgba(0,223,255,.5);
  box-shadow:0 0 0 1px rgba(0,223,255,.3),0 0 30px -10px rgba(0,223,255,.65),
             0 18px 40px -18px #000}
[data-skin="neon"] .pin.rec{background:var(--rojo);box-shadow:0 0 10px var(--rojo)}
[data-skin="neon"] .giro{border-top-color:var(--ac);box-shadow:0 0 12px -4px var(--ac)}
[data-skin="neon"] .chip{border-color:rgba(0,223,255,.18)}

/* -- línea de tiempo -- */
[data-skin="neon"] .seg{
  background:linear-gradient(180deg,var(--ac),#0a7d99);
  box-shadow:0 0 8px -2px rgba(0,223,255,.65)}
[data-skin="neon"] .mev{background:var(--mag);box-shadow:0 0 7px -1px rgba(255,47,176,.8)}
[data-skin="neon"] .mev.varios{background:linear-gradient(180deg,#ff6ac8,var(--mag))}
[data-skin="neon"] .cursor{background:var(--ac);box-shadow:0 0 12px var(--ac)}
[data-skin="neon"] .cursor::before{background:var(--ac);box-shadow:0 0 12px var(--ac)}
[data-skin="neon"] .visor{border-color:rgba(0,223,255,.2);
  box-shadow:0 0 34px -18px rgba(0,223,255,.6),0 22px 55px -28px #000}
[data-skin="neon"] ::-webkit-scrollbar-thumb{background:#16283a;background-clip:content-box}
[data-skin="neon"] ::-webkit-scrollbar-thumb:hover{background:#1d3d55;background-clip:content-box}

/* -- selector de skin -- */
.skins{display:flex;gap:5px;margin-bottom:11px}
.skin{
  flex:1;height:23px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:9.5px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--txt4);
  border:1px solid var(--linea);background:transparent;transition:all .18s var(--curva);
}
.skin:hover{color:var(--txt2);border-color:var(--linea2)}
.skin.on{color:var(--ac);border-color:var(--ac);background:rgba(123,140,245,.1)}
[data-skin="neon"] .skin.on{
  background:rgba(0,223,255,.12);box-shadow:0 0 14px -5px var(--ac)}

/* ---------- login ---------- */
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1000px 560px at 50% 30%,rgba(0,223,255,.10),transparent 62%),var(--bg)}
.login-caja{width:340px;padding:32px 30px;border-radius:16px;
  border:1px solid var(--linea2);background:linear-gradient(165deg,#0d1017,#08090d);
  box-shadow:0 30px 80px -30px #000}
[data-skin="neon"] .login-caja{border-color:rgba(0,223,255,.22);
  box-shadow:0 0 40px -14px rgba(0,223,255,.5),0 30px 80px -30px #000}
.login-caja img{width:150px;display:block;margin:0 auto 6px}
.login-caja .lt{text-align:center;font-size:11px;color:var(--txt3);margin-bottom:22px;
  letter-spacing:.04em}
.login-caja label{margin-top:12px}
.login-caja input{width:100%;height:36px}
.login-caja .btn{width:100%;justify-content:center;height:38px;margin-top:20px}
.login-err{font-size:11.5px;color:var(--rojo);min-height:15px;margin-top:12px;text-align:center}
.usuario-chip{display:flex;align-items:center;gap:8px;padding:0 10px;height:30px;border-radius:8px;
  border:1px solid var(--linea2);background:var(--panel2);font-size:11.5px;color:var(--txt2)}
.usuario-chip b{color:var(--txt);font-weight:500}
.usuario-chip .rol{font-size:9px;text-transform:uppercase;letter-spacing:.08em;
  padding:2px 6px;border-radius:4px;background:rgba(123,140,245,.14);color:var(--ac)}
[data-skin="neon"] .usuario-chip .rol{background:rgba(0,223,255,.12);color:var(--ac)}
.usuario-chip .rol.op{background:rgba(217,164,65,.14);color:var(--ambar)}
.salir{cursor:pointer;color:var(--txt3);display:inline-flex;align-items:center;padding:0 4px}
.salir:hover{color:var(--rojo)}
.salir.ac:hover{color:var(--ac)}

/* Alguien puede tener el sistema en "menos movimiento". Respetarlo. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
<script>
/* Se aplica antes de pintar: si esto viviera con el resto del script, al
   final del body, la página arrancaría clara y saltaría a la skin. */
try{document.documentElement.dataset.skin=localStorage.getItem('sistema-videovigilancia.skin')||'neon'}
catch(e){document.documentElement.dataset.skin='neon'}
</script>
</head>
<body>
<div id="app">
  <aside>
    <div class="marca">
      <div class="logo-txt" role="img" aria-label="Sistema de Videovigilancia">Sistema de<br>Videovigilancia</div>
      <div class="nombre"><span>VMS self-hosted</span>
        <button class="ocultar" id="bOcultar" title="Ocultar la barra">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3L5 8l5 5"/></svg></button></div>
    </div>
    <div class="lateral">
      <nav id="nav"></nav>
      <div class="rotulo">Sitios</div>
      <div id="sitios"></div>
    </div>
    <div class="pie">
      <div class="usuario-chip" id="uChip" style="margin-bottom:11px" hidden></div>
      <div class="skins">
        <button class="skin" data-skin="neon">Neón</button>
        <button class="skin" data-skin="clasico">Clásico</button>
      </div>
      <div style="display:flex"><span>Grabado</span><b class="mono" style="margin-left:auto;color:var(--txt)" id="gTot">·</b></div>
      <div class="barra"><i id="b1" style="width:0"></i></div>
      <div style="display:flex;font-size:10px;color:var(--txt3)"><span id="gDias">·</span><span class="mono" style="margin-left:auto" id="volTxt">·</span></div>
      <div class="autor">
        <b>Mauricio Figueroa</b>
        Desarrollo, diseño y soporte
      </div>
    </div>
  </aside>
  <main>
    <header>
      <button class="btn solo-icono" id="bMostrar" title="Mostrar la barra" hidden>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
      <div><h1 id="titulo">Muro en vivo</h1><div class="sub" id="subtitulo">cargando…</div></div>
      <div class="crece"></div>
      <div id="acciones" style="display:flex;gap:9px"></div>
    </header>
    <section id="vista"></section>
  </main>
</div>
<div id="modales"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const api=async(p,o)=>{const r=await fetch(p,o);const j=await r.json().catch(()=>({}));
  // La sesión venció o no hay: volver al login en vez de romper en silencio.
  if(r.status===401){mostrarLogin();throw new Error(j.detail||'sin sesión')}
  if(!r.ok)throw new Error(j.detail||('HTTP '+r.status));return j;};
const post=(p,c)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c||{})});
// Quién soy. rol 'admin' habilita las modificaciones; 'operador' sólo mira.
let usuario=null,rol=null;
const esAdmin=()=>rol==='admin';
const d2=n=>String(n).padStart(2,'0');
/* Con un solo argumento formatea la hora de una fecha; con el segundo,
   formatea directamente unos segundos transcurridos del dia. */
const hms=(d,seg)=>{
  if(seg!=null){const s=Math.max(0,Math.floor(seg));
    return `${d2(Math.floor(s/3600))}:${d2(Math.floor(s/60)%60)}:${d2(s%60)}`}
  return `${d2(d.getHours())}:${d2(d.getMinutes())}:${d2(d.getSeconds())}`};
const ICO={
  plano:'<path d="M1.8 4.2l4.2-2 4 2 4.2-2v9.6l-4.2 2-4-2-4.2 2z" stroke-linejoin="round"/><path d="M6 2.2v9.6M10 4.2v9.6"/>',
  muro:'<rect x="2" y="2" width="5" height="5" rx="1.3"/><rect x="9" y="2" width="5" height="5" rx="1.3"/><rect x="2" y="9" width="5" height="5" rx="1.3"/><rect x="9" y="9" width="5" height="5" rx="1.3"/>',
  repro:'<circle cx="8" cy="8" r="6.2"/><path d="M6.6 5.5l4.1 2.5-4.1 2.5z" stroke-linejoin="round"/>',
  eventos:'<path d="M1.5 8h3l2-5.2 3 10.4 2-5.2h3" stroke-linecap="round" stroke-linejoin="round"/>',
  camaras:'<rect x="1.6" y="4.2" width="12.8" height="9" rx="2"/><circle cx="8" cy="8.7" r="2.4"/><path d="M5.6 4.2l.9-1.7h3l.9 1.7" stroke-linejoin="round"/>',
  disco:'<ellipse cx="8" cy="4" rx="5.4" ry="2.2"/><path d="M2.6 4v8c0 1.2 2.4 2.2 5.4 2.2s5.4-1 5.4-2.2V4"/><path d="M2.6 8c0 1.2 2.4 2.2 5.4 2.2s5.4-1 5.4-2.2"/>',
  auditoria:'<path d="M3.4 1.8h6.2l3 3v9.4H3.4z" stroke-linejoin="round"/><path d="M9.4 1.8v3h3.2M5.6 8h4.8M5.6 10.6h3.2"/>',
  usuarios:'<circle cx="6.2" cy="5.6" r="2.5"/><path d="M1.7 13.4c0-2.5 2-4.2 4.5-4.2s4.5 1.7 4.5 4.2"/><path d="M10.8 3.5a2.5 2.5 0 010 4.6M11.6 9.6c1.6.4 2.7 1.8 2.7 3.8"/>'};
const svg=k=>`<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.45">${ICO[k]}</svg>`;

let camaras=[],almac=null,arch=null,creds=[],evRes=null;
/* ---------- estado real de la transmisión ----------
   Lo que el grabador está haciendo, según el servidor. Antes el botón decía
   "Transmitiendo" sólo porque alguien lo había apretado, y volvía a decir
   "Iniciar transmisión" al cambiar de vista aunque los 33 ffmpeg siguieran
   corriendo. Ahora esto lo alimenta /api/grabador y el botón se pinta de acá. */
let tx={total:0,corriendo:0,en_vivo:0,transmitiendo:false,arrancando:false,caidas:[]};
let txOcupado=false;          // hay un iniciar/detener en curso: no repintar
let vista='muro';
/* Filtro de la barra lateral. Reemplaza al viejo `filtroSitio`, que sólo sabía
   de los sitios del inventario: ahora la barra refleja la MISMA estructura que
   el plano —locaciones, subgrupos y cámaras—, así que el filtro tiene que
   poder apuntar a cualquiera de esos tres. */
let filtro={tipo:null,id:null,etiqueta:null};
/* Ramas desplegadas. Se guardan para que moverse por la app no cierre el árbol
   que el usuario dejó abierto. */
let ramasAbiertas=new Set();
try{ramasAbiertas=new Set(JSON.parse(localStorage.getItem('sistema-videovigilancia.ramas')||'[]'))}catch(e){}
const guardarRamas=()=>{try{
  localStorage.setItem('sistema-videovigilancia.ramas',JSON.stringify([...ramasAbiertas]))}catch(e){}};
const players=new Map();

/* ---------- que se esta mirando ----------
   Las cámaras H.265 hay que convertirlas para poder verlas en el navegador, y
   eso cuesta CPU: el servidor sólo convierte las que están efectivamente en
   pantalla. Acá se lleva esa cuenta y se avisa. Un recuadro que quedó fuera
   del scroll no cuenta como mirado — de eso se ocupa el IntersectionObserver.
   El aviso vence solo en el servidor, así que hay que renovarlo. */
const enPantalla=new Set();
let latido=null,ultimoMirar={};
let ojo=null;
function observarTiles(){
  if(ojo)ojo.disconnect();
  enPantalla.clear();
  ojo=new IntersectionObserver(es=>{
    for(const e of es){
      const id=+e.target.dataset.cam;
      if(e.isIntersecting)enPantalla.add(id);else enPantalla.delete(id);
    }
    avisarMirando();
  },{threshold:0.15});
  $$('.tile[data-cam]').forEach(t=>ojo.observe(t));
}
async function avisarMirando(){
  if(!usuario||!conVideo())return;   // sin sesión no se avisa nada
  try{ultimoMirar=await post('/api/grabador/mirando',{camaras:[...enPantalla]})}catch{}
  pintarEstadoConversion();
}
function arrancarLatido(){
  if(latido)clearInterval(latido);
  latido=setInterval(()=>{conVideo()?avisarMirando():soltarMirando()},8000);
}
async function soltarMirando(){
  if(latido){clearInterval(latido);latido=null}
  if(ojo){ojo.disconnect();ojo=null}
  if(!enPantalla.size)return;
  enPantalla.clear();
  try{await post('/api/grabador/mirando',{camaras:[]})}catch{}
}
/* Un recuadro que no se puede ver todavía tiene que decir por qué. Antes de
   esto quedaba negro y sin explicación, que es lo peor de los dos mundos. */
function pintarEstadoConversion(){
  for(const c of (ultimoMirar.camaras||[])){
    const e=$('#e'+c.camara_id);if(!e)continue;
    if(c.estado==='sin_cupo'){
      e.style.display='flex';
      e.innerHTML=`sin cupo de conversión (${ultimoMirar.cupo} a la vez)`;
    }else if(c.estado==='preparando'&&!players.has(c.camara_id)){
      e.style.display='flex';e.innerHTML='<div class="giro"></div>preparando…';
    }
  }
}

async function cargar(){
  // `/api/sitios` ya no se pide: la barra lateral se arma con los grupos del
  // plano, no con los sitios del inventario.
  const [cs,al,ar,cr,er]=await Promise.all([
    api('/api/camaras'),api('/api/almacenamiento'),
    api('/api/archivo'),api('/api/credenciales'),api('/api/eventos/resumen')]);
  camaras=cs.camaras;almac=al;arch=ar;creds=cr.credenciales;evRes=er;
  // Los grupos los necesita la barra lateral en todas las vistas, no sólo el
  // plano: es de ahí que sale el árbol de locaciones.
  await cargarGrupos();

  // Auditoría sólo para admin: el registro de quién miró qué es información
  // sensible por sí misma.
  $('#nav').innerHTML=[['plano','Plano',''],['muro','Muro en vivo',''],['repro','Reproducción',''],
    ['eventos','Eventos',er.total||''],['camaras','Cámaras',cs.total],
    ['disco','Almacenamiento',''],
    ...(esAdmin()?[['auditoria','Auditoría',''],['usuarios','Usuarios','']]:[])].map(([k,t,n])=>
    `<div class="nav ${vista===k?'on':''}" data-v="${k}">${svg(k)}<span>${t}</span>${n!==''?`<span class="n">${n}</span>`:''}</div>`).join('');
  $$('.nav').forEach(n=>n.onclick=()=>{vista=n.dataset.v;cargar()});
  pintarUsuario();

  pintarArbolSitios();

  $('#gTot').textContent=arch.gb.toFixed(2)+' GB';
  // Horas reales grabadas, no el lapso entre el primer y el último segmento:
  // ese decía "4,15 días" cuando había una hora por cámara.
  $('#gDias').textContent=textoCobertura();
  $('#volTxt').textContent=almac.volumen_tb+' TB';
  $('#b1').style.width=Math.min(100,arch.gb/arch.limite_gb*100).toFixed(2)+'%';
  // Salir de las vistas que muestran video suelta las conversiones en el acto
  // en vez de esperar a que venza el aviso: son los segundos de CPU más caros
  // del servidor.
  if(!conVideo())soltarMirando();
  if(vista!=='disco')pararDisco();
  ({plano:vPlano,muro:vMuro,repro:vRepro,eventos:vEventos,camaras:vCamaras,disco:vDisco,auditoria:vAuditoria,usuarios:vUsuarios}[vista]||vMuro)();
}
/* La barra lateral repite la estructura del plano: locaciones de primer
   nivel, sus subgrupos adentro y, en el último nivel, las cámaras. Es la misma
   `gruposPlano` que dibuja el mapa, así que lo que el usuario arma en el plano
   aparece acá sin tener que ordenarlo dos veces. */
const CHEV='<svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor"'
  +' stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';

function pintarArbolSitios(){
  const cont=$('#sitios');if(!cont)return;
  const total=camaras.length,vivas=camaras.filter(c=>c.estado==='en_linea').length;
  // Un filtro que apunta a un grupo borrado dejaría el muro vacío sin motivo.
  if(filtro.tipo==='grupo'&&!grupoPorId(filtro.id))filtro={tipo:null,id:null,etiqueta:null};

  const fila=(g,nivel)=>{
    const hijos=hijosDe(g.id);
    const cams=(g.camaras||[]).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
    const abierto=ramasAbiertas.has(g.id);
    const puedeAbrir=hijos.length||cams.length;
    const sel=filtro.tipo==='grupo'&&filtro.id===g.id;
    let h=`<div class="sitio ${sel?'on':''}" data-g="${g.id}" title="${g.nombre}"
        style="padding-left:${13+nivel*12}px">
      <span class="chev ${puedeAbrir?'':'sinhijos'} ${abierto?'abierto':''}" data-tog="${g.id}">${CHEV}</span>
      <span class="p"></span><span class="nom">${g.nombre}</span>
      <span class="n">${g.en_linea}/${g.total}</span></div>`;
    if(!abierto)return h;
    h+=hijos.map(x=>fila(x,nivel+1)).join('');
    h+=cams.map(c=>{
      const s=filtro.tipo==='camara'&&filtro.id===c.id;
      return `<div class="sitio cam ${s?'on':''}" data-c="${c.id}" title="${c.nombre}"
        style="padding-left:${13+(nivel+1)*12+9}px">
        <span class="est ${c.estado==='en_linea'?'on':''}"></span>
        <span class="nom">${c.nombre}</span></div>`}).join('');
    return h;
  };

  cont.innerHTML=
    `<div class="sitio ${filtro.tipo?'':'on'}" data-todo="1" style="padding-left:13px">
       <span class="chev sinhijos"></span><span class="p"></span>
       <span class="nom">Todas las cámaras</span><span class="n">${vivas}/${total}</span></div>`
    +raizPlano().map(g=>fila(g,0)).join('')
    +(sinGrupo.length
      ? `<div class="sitio suelto ${filtro.tipo==='sueltas'?'on':''}" data-sueltas="1" style="padding-left:13px">
          <span class="chev sinhijos"></span><span class="p"></span>
          <span class="nom">Sin agrupar</span><span class="n">${sinGrupo.length}</span></div>`
      : '')
    +(raizPlano().length?'':`<div style="padding:10px 17px;font-size:10.5px;color:var(--txt4);line-height:1.5">
        Todavía no hay locaciones. Armalas en <b>Plano</b> y aparecen acá.</div>`);

  // El chevron despliega; el resto de la fila filtra. Son dos gestos distintos
  // sobre la misma fila a propósito: abrir una locación para ver qué tiene no
  // debería cambiar lo que estás mirando en el muro.
  cont.querySelectorAll('[data-tog]').forEach(e=>e.onclick=ev=>{
    ev.stopPropagation();
    const id=+e.dataset.tog;
    ramasAbiertas.has(id)?ramasAbiertas.delete(id):ramasAbiertas.add(id);
    guardarRamas();pintarArbolSitios();
  });
  cont.querySelectorAll('[data-todo]').forEach(e=>e.onclick=()=>aplicarFiltro(null));
  cont.querySelectorAll('[data-sueltas]').forEach(e=>e.onclick=()=>
    aplicarFiltro(filtro.tipo==='sueltas'?null:{tipo:'sueltas',id:null,etiqueta:'sin agrupar'}));
  /* La estructura de locaciones se arma DESDE ACÁ, no sólo desde el plano: la
     barra lateral está en todas las vistas y ya muestra el árbol. Es el mismo
     menú que el del mapa, no una copia. */
  cont.querySelectorAll('[data-g]').forEach(e=>
    e.oncontextmenu=ev=>menuGrupo(ev,+e.dataset.g));
  cont.querySelectorAll('[data-g]').forEach(e=>e.onclick=()=>{
    const g=grupoPorId(+e.dataset.g);if(!g)return;
    aplicarFiltro(filtro.tipo==='grupo'&&filtro.id===g.id
      ? null : {tipo:'grupo',id:g.id,etiqueta:ramaDe(g.id).map(r=>r.nombre).join(' › ')});
  });
  cont.querySelectorAll('[data-c]').forEach(e=>{
    const id=+e.dataset.c;
    e.onclick=()=>{
      const c=camaras.find(x=>x.id===id);
      aplicarFiltro(filtro.tipo==='camara'&&filtro.id===id
        ? null : {tipo:'camara',id,etiqueta:(c||{}).nombre});
    };
    e.oncontextmenu=ev=>menuCamara(ev,id);
  });
}
function aplicarFiltro(f){
  filtro=f||{tipo:null,id:null,etiqueta:null};
  // Filtrar desde la barra lleva al muro: es donde el filtro se ve.
  if(vista!=='muro'&&vista!=='camaras')vista='muro';
  cargar();
}

const conVideo=()=>vista==='muro'||vista==='plano';
/* Vistas que NO se pueden rearmar solas: tienen un <video> andando o un
   gráfico que se refresca por su cuenta. Rearmarles el DOM corta la
   transmisión, o —en Reproducción— tira el reproductor y lo devuelve al
   principio del día cada 30 segundos, que es buena parte de lo que hacía que
   reproducir "costara". */
const vistaViva=()=>conVideo()||vista==='repro'||vista==='disco';
/* Chip de usuario + salir, abajo en la barra. El rol se lee acá de un vistazo,
   que para el operador es media función: saber que está en modo solo-lectura. */
function pintarUsuario(){
  const c=$('#uChip');if(!c||!usuario)return;
  c.hidden=false;
  // Sólo la etiqueta del rol. El nombre de usuario iba al lado y en este
  // sistema los usuarios se llaman "Admin" y "Operador", así que se leía dos
  // veces lo mismo con dos tipografías distintas.
  c.innerHTML=`<span class="rol ${esAdmin()?'':'op'}">${esAdmin()?'admin':'operador'}</span>`
    +`<span class="crece" style="flex:1"></span>`
    // El nombre propio es donde uno va a buscar las cuentas, sea o no el lugar
    // donde las pusimos. Para un admin el chip lleva a Usuarios.
    +(esAdmin()?`<span class="salir ac" id="uGest" title="Usuarios del sistema">`
      +svg('usuarios')+`</span>`:'')
    +`<span class="salir" id="uSalir" title="Cerrar sesión">`
    +`<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" `
    +`stroke-width="1.4"><path d="M6 2H3v12h3M10 5l3 3-3 3M13 8H6" stroke-linecap="round" `
    +`stroke-linejoin="round"/></svg></span>`;
  $('#uSalir').onclick=salir;
  if($('#uGest'))$('#uGest').onclick=()=>{vista='usuarios';cargar()};
}
/* Ids de las cámaras de un grupo Y de todos sus subgrupos: filtrar por
   "San Sebastián" tiene que traer lo que cuelga de sus talleres, no sólo lo
   que esté pegado al yacimiento. */
function camarasDeGrupo(gid){
  const out=new Set(),pend=[gid];
  while(pend.length){
    const g=grupoPorId(pend.pop());if(!g)continue;
    (g.camaras||[]).forEach(c=>out.add(c.id));
    (g.hijos||[]).forEach(h=>pend.push(h));
  }
  return out;
}
function camarasDelFiltro(){
  if(!filtro.tipo)return camaras;
  if(filtro.tipo==='camara')return camaras.filter(c=>c.id===filtro.id);
  if(filtro.tipo==='sueltas'){
    const ids=new Set(sinGrupo.map(c=>c.id));
    return camaras.filter(c=>ids.has(c.id));
  }
  const ids=camarasDeGrupo(filtro.id);
  return camaras.filter(c=>ids.has(c.id));
}
const enLinea=()=>camarasDelFiltro().filter(c=>c.estado==='en_linea');
const sufijoFiltro=()=>filtro.etiqueta?' · '+filtro.etiqueta:'';

/* ---------------- muro ---------------- */
/* Los tres botones de la cabecera son los mismos en Muro y en Plano. `cuales`
   devuelve qué cámaras levantar; si son todas las del parque se pide de una
   sola vez en vez de una por una. */
function botonesTransmision(cuales){
  // Rendimiento es config global y por lo tanto de admin; el backend igual lo
  // rechaza para un operador. El operador sí puede Iniciar, porque es lo que
  // necesita para ver el vivo, pero no detener.
  // Un solo botón para las dos cosas: dice lo que está pasando de verdad y, si
  // está transmitiendo y sos admin, es el que lo corta.
  $('#bPlay').onclick=()=>{
    if(txOcupado)return;
    if(tx.transmitiendo){modalDetener();return}
    iniciarTransmision(cuales);
  };
  pintarBotonTransmision();
}
/* El botón se pinta con `tx` —lo que informa el servidor—, nunca con lo que se
   acaba de apretar. */
function pintarBotonTransmision(){
  const b=$('#bPlay');if(!b||txOcupado)return;
  if(!tx.transmitiendo){
    b.className='btn pri';b.disabled=false;
    b.textContent='Iniciar transmisión';
    b.title='Levanta la captura de todas las cámaras en línea y empieza a guardar en disco';
    return;
  }
  if(tx.arrancando){
    b.className='btn';b.disabled=true;
    b.innerHTML=`<span class="giro"></span>Levantando ${tx.corriendo}/${tx.total}`;
    b.title='Los procesos de captura se levantan escalonados, uno cada cuarto de segundo';
    return;
  }
  // Detener lo puede pedir cualquiera que este logueado, operador incluido:
  // lo que lo frena no es el rol sino tener que escribir la contraseña.
  //
  // Una cámara caída NO deja el botón en "Levantando": el arranque escalonado
  // termina en segundos y lo que sigue son fallas, que se cuentan aparte. Que
  // el botón siguiera atascado ahí era, además de mentira, quedarse sin manera
  // de detener la transmisión.
  const caidas=tx.caidas.length;
  b.className='btn tx puede';b.disabled=false;
  b.innerHTML=`<span class="txVivo" style="display:inline-flex;align-items:center;gap:7px">`
    +`<span class="punto"></span>Transmitiendo ${tx.corriendo}`
    +(caidas?`<span class="txCaidas">${caidas} caída${caidas>1?'s':''}</span>`:'')
    +`</span><span class="txDet">Detener transmisión</span>`;
  b.title=`${tx.corriendo} cámaras capturando y grabando. `
    +(caidas?`Sin levantar: ${tx.caidas.map(c=>c.nombre).join(', ')}. `:'')
    +`Click para detener: te va a pedir tu contraseña.`;
}
async function iniciarTransmision(cuales){
  const b=$('#bPlay');
  txOcupado=true;b.disabled=true;b.className='btn';
  b.innerHTML='<span class="giro"></span>Iniciando…';
  try{
    // Se levantan TODAS las que estan en linea, no una docena fija: el limite
    // pertenece a la vista, no al grabador.
    const cs=cuales();
    if(cs.length===camaras.filter(c=>c.estado==='en_linea').length)await post('/api/grabador/iniciar');
    else for(const c of cs)await post(`/api/grabador/iniciar?camara_id=${c.id}`);
  }catch(e){$('#subtitulo').textContent='No se pudo iniciar: '+e.message}
  finally{txOcupado=false;b.disabled=false}
  vigilar();
}
/* Detener corta el vivo Y la grabación de todo el parque, y de eso nadie se
   entera hasta el día que hace falta el video. Es la única acción del sistema
   que vuelve a pedir la contraseña; el backend la verifica igual —esto es
   contra el clic de más, no es el candado. */
function modalDetener(){
  $('#modales').innerHTML=`<div class="fondo" id="fondo"><div class="modal" style="width:430px">
    <h2>Detener la transmisión</h2>
    <div class="d">Se cortan los <b>${tx.corriendo}</b> procesos de captura: deja de verse
      el muro y <b>deja de grabarse en disco</b> hasta que alguien la vuelva a iniciar.
      Lo que ya está grabado no se toca.</div>
    <div class="err" id="err"></div>
    <div class="campo"><label>Contraseña de ${usuario}</label>
